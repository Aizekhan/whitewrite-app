<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WhiteWrite — Біблія світу</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* Game Bible of a world: a spine of sections on the left, the cards of one section
   on the right, an editing leaf sliding over. Canon sections (characters, locations,
   factions, items) are the world's own entities with game fields added on them. */
:root{
  --bg-0:#070608; --bg-1:#101012; --bg-2:#16161a; --bg-3:#1d1d22; --bg-hover:#232329;
  --line:rgba(255,255,255,0.07); --line-2:rgba(255,255,255,0.12);
  --gold:#d97706; --gold-lit:#f0a93b; --gold-bright:#f6cf7e; --gold-soft:rgba(217,119,6,0.14);
  --violet-lit:#9d6bff;
  --tx-hi:#f3efe7; --tx:#c7c2bb; --tx-mid:#8a857e; --tx-low:#5d5953;
  --s-idea:#b9a8e0; --s-agreed:#7fb6ff; --s-work:#f0a93b; --s-game:#7fc48a; --s-redo:#e0675a;
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--bg-0); }
body{ color:var(--tx); font:15px/1.55 "Inter",system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  display:grid; grid-template-columns:260px 1fr; }
button,input,select,textarea{ font:inherit; color:inherit; }
h1,h2,h3{ font-family:"Cinzel",serif; font-weight:600; color:var(--tx-hi); margin:0; letter-spacing:.02em; }
:focus-visible{ outline:2px solid var(--gold-lit); outline-offset:2px; border-radius:5px; }
.ww-embed body{ padding-top:0; }
/* scrollbars in the house style: thin, dark, gold on hover */
*{ scrollbar-width:thin; scrollbar-color:#2c2a30 transparent; }
*::-webkit-scrollbar{ width:9px; height:9px; }
*::-webkit-scrollbar-track{ background:transparent; }
*::-webkit-scrollbar-thumb{ background:#2c2a30; border:2px solid transparent; background-clip:padding-box; border-radius:9px; }
*::-webkit-scrollbar-thumb:hover{ background:rgba(217,160,70,0.55); background-clip:padding-box; }
*::-webkit-scrollbar-corner{ background:transparent; }

/* spine */
nav{ background:linear-gradient(180deg,#0e0d10,#09080a); border-right:1px solid var(--line); padding:22px 14px;
  overflow-y:auto; height:100vh; position:sticky; top:0; display:flex; flex-direction:column; gap:3px; }
.ww-embed nav{ margin-top:118px; height:calc(100vh - 118px); padding-top:14px; padding-bottom:84px;
  -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 18px); mask-image:linear-gradient(to bottom, transparent 0, #000 18px); } /* scrolls below the shell's logo, clears its user dock */
.brand{ font:700 1.35rem/1.15 "Cinzel",serif; color:var(--tx-hi); margin:0 6px; }
.brand small{ display:block; font:500 11px "Inter"; color:var(--gold-lit); letter-spacing:.24em; text-transform:uppercase; margin-top:7px; }
.rule{ height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); opacity:.45; margin:14px 0 10px; }
.nav-item{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:8px 10px; border-radius:8px;
  border:0; background:none; cursor:pointer; color:var(--tx-mid); }
.nav-item:hover{ background:var(--bg-hover); color:var(--tx-hi); }
.nav-item[aria-current="true"]{ background:var(--gold-soft); color:var(--tx-hi); box-shadow:inset 2px 0 0 var(--gold-lit); }
.nav-item .n{ margin-left:auto; font-size:12px; font-variant-numeric:tabular-nums; }
.nav-item .canon{ font-size:10px; color:var(--violet-lit); letter-spacing:.06em; }
.nav-add{ margin-top:6px; border:1px dashed var(--line-2); border-radius:8px; background:none; color:var(--tx-mid);
  padding:7px 10px; cursor:pointer; text-align:left; }
.nav-add:hover{ color:var(--gold-lit); border-color:rgba(217,160,70,0.45); }
.newsec{ display:grid; gap:6px; margin-top:6px; }
.newsec input{ background:var(--bg-2); border:1px solid var(--line-2); border-radius:7px; padding:7px 9px; }
/* world block folds away (arrow), the game picker follows it, project settings close the menu */
.navtoggle{ display:flex; align-items:center; gap:6px; width:calc(100% - 12px); background:none; border:0; cursor:pointer; padding:0; text-align:left; }
.navtoggle:hover{ color:var(--gold-lit); }
.navtoggle .arr{ display:inline-grid; place-items:center; width:26px; height:26px; border-radius:7px; color:var(--gold-bright);
  background:var(--gold-soft); border:1px solid rgba(240,169,59,.4); transition:transform .15s, background .15s; flex:none; }
.navtoggle:hover .arr{ background:rgba(217,119,6,.28); }
.navtoggle{ gap:9px; font-size:11.5px; }
.navtoggle[aria-expanded="false"] .arr{ transform:rotate(-90deg); }
.gamerow{ display:flex; align-items:center; gap:8px; margin:16px 6px 6px; }
.gamerow label{ font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--tx-low); flex:none; }
.gamerow #gamepick{ flex:1; min-width:0; margin:0; }
#nav-foot{ margin-top:auto; padding-top:14px; }
#nav-foot .nav-item{ border-top:1px solid var(--line); border-radius:0 0 8px 8px; padding-top:10px; }
/* project settings */
.setbox{ border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin:16px 0; display:grid; gap:12px; background:var(--bg-1); }
.setbox h2{ margin:0; font-size:18px; }
.setrow{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.setrow input, .setrow select{ flex:1 1 240px; background:var(--bg-2); border:1px solid var(--line-2); border-radius:8px; padding:8px 10px; }
.setbox .hint{ margin:0; font-size:13px; color:var(--tx-mid); }
.setbox.danger{ border-color:rgba(208,103,90,.4); background:rgba(208,103,90,.05); }
.secrow{ display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--line); }
.secrow span{ flex:1; }
.aicost{ display:inline-block; margin-left:5px; font-size:10px; line-height:1; color:var(--gold-bright); vertical-align:super; opacity:.85; cursor:help; }
.btn.primary .aicost{ color:inherit; }
.shownsecs{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:4px 14px; }
.chip[aria-pressed="true"]{ box-shadow:inset 0 0 0 1px var(--gold-lit); }
.ask-box .warn{ margin:0; font-size:13.5px; color:var(--tx-mid); line-height:1.5; }
.ask-box .warn b{ color:var(--tx-hi); }
.sync{ font-size:12px; color:var(--tx-low); }
.dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--tx-low); margin-right:6px; vertical-align:middle; }
.dot.ok{ background:var(--s-game); } .dot.bad{ background:var(--s-redo); }

/* main */
main{ min-width:0; padding:0 30px 60px; height:100vh; overflow-y:auto; }
.ww-embed main{ margin-top:118px; height:calc(100vh - 118px); } /* scrolls below the shell's logo, never under it */
.bar{ position:sticky; top:0; z-index:3; background:var(--bg-0); padding:16px 0 12px; display:flex; flex-wrap:wrap; gap:8px;
  align-items:center; border-bottom:1px solid var(--line); }
.ico-btn{ display:inline-grid; place-items:center; width:36px; height:36px; padding:0; flex:none; color:var(--gold-lit); }
.ico-btn svg{ width:19px; height:19px; }
#q{ flex:1 1 220px; background:var(--bg-2); border:1px solid var(--line-2); border-radius:8px; padding:8px 11px; }
.chip{ background:var(--bg-2); border:1px solid var(--line-2); border-radius:999px; padding:5px 11px; cursor:pointer; font-size:13px; }
.chip[aria-pressed="true"]{ border-color:var(--gold-lit); background:var(--gold-soft); }
.btn{ background:var(--bg-2); border:1px solid var(--line-2); border-radius:8px; padding:7px 13px; cursor:pointer; }
.btn:hover{ border-color:var(--tx-mid); }
.btn.primary{ background:linear-gradient(180deg,var(--gold-bright),var(--gold-lit)); border-color:transparent; color:#1a1206; font-weight:600; }
.btn.danger{ color:var(--s-redo); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
header.sec{ display:grid; grid-template-columns:1fr auto; gap:18px; align-items:end; padding:26px 0 8px; }
header.sec h1{ font-size:clamp(26px,3vw,38px); line-height:1.05; }
header.sec p{ margin:8px 0 0; color:var(--tx-mid); max-width:70ch; font-style:italic; }
.canonbox{ margin:16px 0 4px; padding:14px 16px; border:1px solid rgba(157,107,255,0.3); border-radius:12px; background:rgba(124,58,237,0.07); }
.canonbox h4{ margin:0 0 6px; font:600 12px "Inter"; letter-spacing:.14em; text-transform:uppercase; color:var(--violet-lit); }
.canonbox ol{ margin:6px 0 0; padding-left:20px; }
h2.group{ font-size:1.15rem; margin:26px 0 10px; display:flex; gap:10px; align-items:baseline; }
h2.group span{ font:400 12.5px "Inter"; color:var(--tx-mid); }
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; margin-top:14px; }
.card{ background:var(--bg-2); border:1px solid var(--line); border-radius:12px; display:flex; flex-direction:column; text-align:left;
  cursor:pointer; padding:12px 14px 14px; gap:7px; transition:border-color .15s, transform .15s; }
.card:hover{ border-color:var(--line-2); transform:translateY(-2px); }
.card h3{ font-size:15px; overflow-wrap:anywhere; }
.card .ex{ margin:0; color:var(--tx-mid); font-size:13px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; }
.tags{ display:flex; gap:5px; flex-wrap:wrap; }
.pill{ font-size:11.5px; border-radius:999px; padding:1px 8px; border:1px solid currentColor; white-space:nowrap; }
.s-idea{ color:var(--s-idea); } .s-agreed{ color:var(--s-agreed); } .s-work{ color:var(--s-work); } .s-game{ color:var(--s-game); } .s-redo{ color:var(--s-redo); }
.flag{ font-size:11px; background:var(--violet-lit); color:#120c1e; border-radius:4px; padding:0 6px; }
.add{ border:1px dashed var(--line-2); border-radius:12px; background:none; color:var(--tx-mid); cursor:pointer; min-height:110px; }
.add:hover{ color:var(--gold-lit); border-color:rgba(217,160,70,0.45); }
.empty{ color:var(--tx-mid); padding:30px 0; font-style:italic; }
.locked{ max-width:560px; margin:18vh auto 0; text-align:center; display:grid; gap:14px; justify-items:center; }
.locked p{ color:var(--tx-mid); margin:0; }

/* leaf (editor) */
.leaf{ position:fixed; inset:0 0 0 auto; width:min(720px,100vw); background:var(--bg-1); border-left:1px solid var(--line-2);
  box-shadow:-20px 0 50px #0009; z-index:10; display:flex; flex-direction:column; transform:translateX(105%); transition:transform .22s ease; }
.leaf.open{ transform:none; }
.scrim{ position:fixed; inset:0; background:#0007; z-index:9; display:none; }
/* embedded: the section title and its actions sit on the shell's logo strip, right of the logo */
.topline{ display:none; }
.ww-embed .topline{ position:fixed; top:0; left:300px; right:24px; height:118px; z-index:5; display:flex; align-items:center; gap:18px; pointer-events:none; }
.ww-embed .topline > *{ pointer-events:auto; }
.ww-embed .topline h1{ font-size:clamp(24px,2.6vw,36px); line-height:1.05; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ww-embed .topline .row{ flex:none; }
.ww-embed header.sec{ grid-template-columns:1fr; padding-top:16px; }
.ww-embed header.sec > div:empty{ display:none; }
.ask{ position:fixed; inset:0; z-index:40; display:grid; place-items:center; background:#000a; backdrop-filter:blur(3px); }
.ask-box{ width:min(420px,calc(100vw - 40px)); background:var(--bg-1); border:1px solid rgba(240,169,59,.35); border-radius:14px;
  box-shadow:0 24px 60px #000c, 0 0 0 1px #0006; padding:20px 22px 18px; display:grid; gap:12px; }
.ask-box h3{ margin:0; font-size:17px; }
.ask-box input{ background:var(--bg-2); border:1px solid var(--line-2); border-radius:8px; padding:9px 11px; font-size:15px; }
.ask-box input:focus{ border-color:var(--gold-lit); outline:none; }
.ask-box .row{ justify-content:flex-end; }
.pick-box{ width:min(560px,calc(100vw - 40px)); }
.picklist{ display:grid; gap:6px; max-height:min(52vh,460px); overflow-y:auto; padding-right:4px; }
.pickrow{ display:flex; align-items:center; gap:10px; padding:7px 10px; border:1px solid var(--line); border-radius:10px; background:var(--bg-2); cursor:pointer; }
.pickrow:hover{ border-color:var(--line-2); }
.pickrow:has(input:checked){ border-color:var(--gold); background:var(--gold-soft); }
.pickrow img,.pickrow .pi{ width:44px; height:44px; flex:none; border-radius:50%; object-fit:cover; background:var(--bg-3); border:1px solid var(--line-2); }
.pickrow span{ display:grid; min-width:0; }
.pickrow b{ color:var(--tx-hi); font-weight:600; }
.pickrow i{ font-style:normal; font-size:12.5px; color:var(--tx-mid); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.scrim.open{ display:block; }
.leaf-head{ padding:18px 22px 12px; border-bottom:1px solid var(--line); display:grid; gap:10px; }
.ww-embed .leaf-head{ padding-top:110px; }
.leaf-head .kicker{ padding-left:36px; }
/* field structure editing: the small gold pencil in the card's top-left corner; red and pulsing while on */
.leaf-head{ position:relative; }
.editbtn{ position:absolute; top:12px; left:12px; width:28px; height:28px; border-radius:50%; display:grid; place-items:center; padding:0; cursor:pointer;
  color:var(--gold-lit); background:var(--gold-soft); border:1px solid rgba(240,169,59,.5); transition:background .15s, color .15s, border-color .15s; }
.editbtn svg{ width:15px; height:15px; }
.editbtn:hover{ border-color:var(--gold-lit); }
.ww-embed .editbtn{ top:72px; }
.editbtn[aria-pressed="true"]{ color:#fff; background:#b8382e; border-color:#e0564f; animation:editpulse 1.4s ease-in-out infinite; }
@keyframes editpulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(224,86,79,.55); } 50%{ box-shadow:0 0 0 7px rgba(224,86,79,0); } }
@media (prefers-reduced-motion:reduce){ .editbtn[aria-pressed="true"]{ animation:none; } }
.fhead{ display:flex; gap:6px; align-items:center; }
.fhead .flabel{ flex:1; min-width:0; background:var(--bg-2); border:1px solid var(--line-2); border-radius:7px; padding:5px 8px; font-size:13px; }
.fhead select{ flex:none; font-size:12.5px; }
.fdel{ flex:none; width:28px; height:28px; border-radius:7px; border:1px solid rgba(208,103,90,.5); background:rgba(208,103,90,.08); color:#e0564f; cursor:pointer; }
.fdel:hover{ background:rgba(208,103,90,.2); }
.field.editing{ border:1px dashed rgba(224,86,79,.35); border-radius:10px; padding:8px; }
.newfield select{ flex:none; }
/* table fields */
.tbl{ overflow-x:auto; }
.tbl table{ border-collapse:collapse; font-size:13px; }
.tbl td{ border:1px solid var(--line-2); padding:0; }
.tbl td input{ width:100%; min-width:90px; background:transparent; border:0; padding:5px 7px; color:var(--tx); }
.tbl tr:first-child td input{ font-weight:600; color:var(--tx-hi); background:#ffffff08; }
.tbl td.tx{ border:0; padding-left:4px; }
.tbl td.tx button, .tbl .rmcol{ background:none; border:0; color:var(--tx-low); cursor:pointer; padding:2px 5px; }
.tbl td.tx button:hover, .tbl .rmcol:hover{ color:#e0564f; }
.tbl .row{ margin-top:6px; } .tbl .row .btn{ padding:3px 9px; font-size:12.5px; }
.fimgs{ display:flex; flex-wrap:wrap; gap:8px; }
.fimg{ position:relative; }
.fimg img{ width:120px; height:80px; object-fit:cover; border-radius:7px; display:block; border:1px solid var(--line-2); }
.fimg button{ position:absolute; top:3px; right:3px; padding:0 6px; font-size:12px; }
.kicker{ font-size:12px; color:var(--tx-mid); letter-spacing:.12em; text-transform:uppercase; }
#e-title,#d-title{ font:600 1.6rem/1.15 "Cinzel",serif; color:var(--tx-hi); background:transparent; border:1px solid transparent; border-radius:8px; padding:2px 6px; margin-left:-6px; width:100%; }
#e-title:hover,#e-title:focus,#d-title:hover,#d-title:focus{ border-color:var(--line-2); background:#0003; }
.row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
select{ background:var(--bg-2); border:1px solid var(--line-2); border-radius:8px; padding:6px 9px; }
.leaf-body{ overflow-y:auto; padding:14px 22px 20px; display:grid; gap:14px; flex:1; align-content:start; }
.field{ display:grid; gap:5px; }
.field label{ font-size:12px; color:var(--tx-mid); letter-spacing:.06em; text-transform:uppercase; display:flex; gap:8px; align-items:center; }
.field label .canon{ text-transform:none; letter-spacing:0; color:var(--violet-lit); }
.shown{ border:1px solid transparent; border-radius:8px; padding:6px 8px; margin:0 -8px; cursor:text; min-height:1.6em; overflow-wrap:anywhere; }
.shown:hover{ border-color:var(--line-2); background:#0003; }
.shown.blank{ color:var(--tx-low); font-style:italic; }
.shown table{ border-collapse:collapse; font-size:13px; margin:6px 0; display:block; overflow-x:auto; }
.shown th,.shown td{ border:1px solid var(--line-2); padding:4px 7px; text-align:left; vertical-align:top; }
.shown p{ margin:0 0 8px; } .shown ul,.shown ol{ margin:0 0 8px; padding-left:20px; }
.shown code,.shown pre{ font-family:"JetBrains Mono",monospace; font-size:12.5px; background:#0004; border-radius:4px; }
.shown pre{ padding:8px; white-space:pre-wrap; }
.shown h4{ margin:8px 0 4px; font-size:14px; }
textarea{ width:100%; background:#0b0a0d; border:1px solid var(--line-2); border-radius:8px; padding:8px 10px; resize:vertical; min-height:70px; line-height:1.5; }
.note textarea{ border-color:rgba(157,107,255,0.4); }
.leaf-foot{ border-top:1px solid var(--line); padding:12px 22px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.leaf-foot .msg{ margin-left:auto; font-size:13px; color:var(--tx-mid); }
.ww-embed .leaf-foot{ padding-right:140px; } /* clear the shell's "?" and bug fabs */
.newfield{ display:flex; gap:8px; }
.newfield input{ flex:1; background:var(--bg-2); border:1px solid var(--line-2); border-radius:8px; padding:6px 9px; }
/* files on a card */
.card .thumb{ width:calc(100% + 28px); margin:-12px -14px 2px; aspect-ratio:16/9; object-fit:cover; border-radius:12px 12px 0 0; background:var(--bg-1); }
.field.files .file{ display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--line); }
.field.files .file img{ width:72px; height:48px; object-fit:cover; border-radius:6px; display:block; }
.field.files .file .ico{ width:72px; text-align:center; font-size:22px; }
.field.files .fname{ flex:1; overflow-wrap:anywhere; color:var(--tx); }
.field.files .file .btn{ padding:2px 8px; }
.field.files > .btn{ justify-self:start; margin-top:8px; cursor:pointer; }
/* 3D viewer (gb-3d.js) */
.card{ position:relative; }
/* world dossier: tabs at the bottom, life timeline with hanging notes */
.card .sub{ margin:-4px 0 0; font-size:12.5px; color:var(--gold-lit); }
.dtabs{ display:flex; gap:4px; padding:8px 14px 0; border-top:1px solid var(--line); overflow-x:auto; flex:none; }
.dtabs button{ flex:none; padding:8px 13px; border-radius:9px 9px 0 0; border:1px solid transparent; border-bottom:none; background:none; color:var(--tx-mid); font:500 13.5px "Inter"; cursor:pointer; }
.dtabs button:hover{ color:var(--tx-hi); }
.dtabs button[aria-selected="true"]{ color:var(--gold-bright); background:var(--bg-2); border-color:var(--line-2); }
.dpanel textarea{ width:100%; }
.dsub{ margin:4px 0 6px; font:600 12px "Inter"; letter-spacing:.12em; text-transform:uppercase; color:var(--tx-mid); }
.dappear{ margin:0 0 10px; padding:0; list-style:none; display:grid; gap:6px; }
.dappear li{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.dappear .btn{ padding:2px 10px; font-size:12.5px; }
.dlinks{ display:flex; flex-wrap:wrap; gap:8px; }
.dlink{ display:inline-flex; align-items:center; gap:7px; padding:6px 11px; border-radius:999px; border:1px solid var(--line-2); background:var(--bg-2); color:var(--tx-hi); font:13.5px "Inter"; }
button.dlink{ cursor:pointer; } button.dlink:hover{ border-color:var(--gold); }
.dlink .k{ font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold-lit); }
.dlink i{ color:var(--tx-mid); font-size:12.5px; }
.life{ overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--bg-2); padding:0 10px; margin-bottom:8px; }
.life-track{ position:relative; display:flex; gap:12px; min-width:max-content; height:250px; padding:0 8px; }
.life-track::before{ content:""; position:absolute; left:0; right:0; top:50%; height:2px; background:linear-gradient(90deg,transparent,var(--gold) 6%,var(--gold) 94%,transparent); }
.ln{ position:relative; width:150px; flex:none; }
.ln::after{ content:""; position:absolute; left:50%; top:50%; height:16px; width:1px; background:var(--gold-lit); opacity:.6; }
.ln.up::after{ top:auto; bottom:50%; }
.ln-dot{ position:absolute; left:50%; top:50%; width:12px; height:12px; margin:-6px 0 0 -6px; border-radius:50%; background:var(--gold-bright); box-shadow:0 0 10px var(--gold); z-index:1; }
.ln-note{ position:absolute; left:0; right:0; top:calc(50% + 16px); max-height:100px; overflow:auto; padding:7px 22px 7px 9px; border:1px solid var(--line-2); border-radius:9px; background:var(--bg-1); font-size:12.5px; line-height:1.4; overflow-wrap:anywhere; }
.ln.up .ln-note{ top:auto; bottom:calc(50% + 16px); }
.ln-note b{ display:block; color:var(--gold-lit); font-size:11.5px; letter-spacing:.03em; margin-bottom:2px; }
.ln-x{ position:absolute; top:3px; right:3px; border:none; background:none; color:var(--tx-low); cursor:pointer; font-size:11px; padding:2px 4px; }
.ln-x:hover{ color:var(--s-redo); }
.card.has3d h3{ padding-right:58px; }
.v3d-pill{ position:absolute; top:8px; right:8px; z-index:2; cursor:pointer; font-size:11px; font-weight:600; letter-spacing:.03em;
  padding:4px 8px; border-radius:999px; color:var(--gold-lit, #f0c878); background:rgba(10,8,6,0.78); border:1px solid rgba(240,200,120,0.45);
  backdrop-filter:blur(4px); transition:background .15s, border-color .15s; }
.v3d-pill:hover, .v3d-pill:focus-visible{ background:rgba(50,33,15,0.92); border-color:rgba(240,200,120,0.9); }
.v3d{ position:fixed; inset:0; z-index:60; background:var(--bg-0); display:flex; flex-direction:column; padding:14px 18px; gap:10px; }
.v3d-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.v3d-head b{ color:var(--tx-hi); overflow-wrap:anywhere; }
.v3d-head .v3d-info{ margin-right:auto; font-size:13px; }
.v3d-head .btn[aria-pressed="true"]{ border-color:var(--gold, #c9a45c); }
.v3d-stage{ flex:1; min-height:0; border:1px solid var(--line-2); border-radius:12px; overflow:hidden; }
.v3d-stage canvas{ display:block; touch-action:none; }
.v3d-hint{ margin:0; font-size:12px; text-align:center; }
.ww-embed .v3d{ padding-top:124px; padding-bottom:64px; } /* clear the shell's logo and bottom fabs */

/* canon vs game, game picker */
.navh{ margin:14px 6px 4px; font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--tx-low); }
.navh:first-child{ margin-top:0; }
#gamepick{ width:100%; margin:0 0 4px; font-family:"Cinzel",serif; color:var(--gold-bright); }
.canon-pill{ color:var(--violet-lit); }
.muted{ color:var(--tx-mid); font-size:13px; }
.hint{ text-transform:none; letter-spacing:0; color:var(--tx-mid); }
.newgame{ max-width:560px; margin:8vh auto 0; display:grid; gap:14px; }
.newgame .field span{ font-size:12px; color:var(--tx-mid); letter-spacing:.06em; text-transform:uppercase; }
.newgame input{ background:var(--bg-2); border:1px solid var(--line-2); border-radius:8px; padding:9px 11px; }

/* import + production plan */
.pmsg{ margin:10px 0 4px; color:var(--tx); }
.pmsg.err{ color:var(--s-redo); }
.psec{ margin-top:22px; }
.imp{ display:flex; gap:10px; align-items:flex-start; padding:8px 10px; border:1px solid var(--line); border-radius:9px; margin:6px 0; background:var(--bg-2); cursor:pointer; }
.imp input{ margin-top:4px; accent-color:var(--gold-lit); }
.ready{ display:flex; align-items:center; gap:12px; margin:6px 0 10px; font-size:13px; color:var(--tx-mid); }
.ready__bar{ flex:0 1 260px; height:8px; border-radius:6px; background:var(--bg-3); overflow:hidden; }
.ready__bar i{ display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-bright)); }
.gsecs{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:8px; }
.gsec{ padding:9px 11px; border:1px solid var(--line); border-radius:9px; background:var(--bg-2); }
.g-solid{ color:var(--s-game); } .g-partial{ color:var(--s-work); } .g-missing{ color:var(--s-redo); }
.p-blocker{ color:var(--s-redo); } .p-important{ color:var(--s-work); } .p-nice{ color:var(--s-idea); }
.contra li{ margin:4px 0; }
.q{ display:grid; gap:8px; padding:14px; margin:10px 0; border:1px solid var(--line-2); border-radius:12px; background:var(--bg-2); }
.q__q{ color:var(--tx-hi); font-weight:500; }
.qa{ padding:8px 0; border-bottom:1px solid var(--line); }
details summary{ cursor:pointer; }
h3.sub{ font-size:1rem; margin:20px 0 6px; }
.ms{ margin:16px 0; padding:14px 16px; border:1px solid var(--line-2); border-radius:12px; background:var(--bg-1); }
.ms h3{ font-size:1.05rem; margin-bottom:6px; }
.ms p{ margin:4px 0; }
.gate{ color:var(--gold-bright); }
.task{ padding:9px 0; border-top:1px solid var(--line); }
.task__d{ color:var(--tx); font-size:14px; margin-top:4px; white-space:pre-wrap; }
.task pre{ white-space:pre-wrap; background:#0005; padding:10px; border-radius:8px; font:12.5px/1.5 "JetBrains Mono",monospace; }
/* execution: task states, review, executor log */
.tst-todo{ color:var(--tx-mid); border-color:var(--line-2); } .tst-in_progress{ color:var(--gold-lit); border-color:rgba(240,169,59,.5); }
.tst-review{ color:#7fb6ff; border-color:rgba(127,182,255,.5); } .tst-rework, .tst-blocked{ color:var(--s-redo); border-color:currentColor; }
.tst-done{ color:var(--s-game); border-color:currentColor; }
.task.t-done .task__h b{ text-decoration:line-through; text-decoration-color:var(--tx-low); }
.treview, .tblock{ margin-top:8px; padding:10px 12px; border-radius:10px; border:1px solid rgba(127,182,255,.35); background:rgba(127,182,255,.06); display:grid; gap:6px; font-size:14px; }
.tblock{ border-color:rgba(208,103,90,.45); background:rgba(208,103,90,.07); }
.crit{ margin:4px 0; padding-left:18px; font-size:13.5px; } .crit li{ margin:2px 0; }
.exlog{ margin:4px 0; padding-left:18px; font-size:13px; } .exlog li{ margin:3px 0; }
.mono{ font-family:"JetBrains Mono",monospace; color:var(--tx-mid); }

@media (max-width:820px){
  body{ grid-template-columns:1fr; }
  nav{ position:static; height:auto; flex-direction:row; flex-wrap:wrap; padding:12px 16px; }
  .brand,.rule,.engine{ display:none; }
  .nav-item{ width:auto; }
  main{ height:auto; padding:0 16px 40px; }
  header.sec{ grid-template-columns:1fr; }
}
@media (prefers-reduced-motion:reduce){ .leaf,.card{ transition:none; } }
