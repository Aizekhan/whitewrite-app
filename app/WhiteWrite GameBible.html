<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WhiteWrite — Біблія гри</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* Game Bible of a world: a spine of sections on the left, the cards of one section
   on the right, an editing leaf sliding over. Canon sections (characters, locations,
   factions, items) are the world's own entities with game fields added on them. */
:root{
  --bg-0:#070608; --bg-1:#101012; --bg-2:#16161a; --bg-3:#1d1d22; --bg-hover:#232329;
  --line:rgba(255,255,255,0.07); --line-2:rgba(255,255,255,0.12);
  --gold:#d97706; --gold-lit:#f0a93b; --gold-bright:#f6cf7e; --gold-soft:rgba(217,119,6,0.14);
  --violet-lit:#9d6bff;
  --tx-hi:#f3efe7; --tx:#c7c2bb; --tx-mid:#8a857e; --tx-low:#5d5953;
  --s-idea:#b9a8e0; --s-agreed:#7fb6ff; --s-work:#f0a93b; --s-game:#7fc48a; --s-redo:#e0675a;
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--bg-0); }
body{ color:var(--tx); font:15px/1.55 "Inter",system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  display:grid; grid-template-columns:260px 1fr; }
button,input,select,textarea{ font:inherit; color:inherit; }
h1,h2,h3{ font-family:"Cinzel",serif; font-weight:600; color:var(--tx-hi); margin:0; letter-spacing:.02em; }
:focus-visible{ outline:2px solid var(--gold-lit); outline-offset:2px; border-radius:5px; }
.ww-embed body{ padding-top:0; }

/* spine */
nav{ background:linear-gradient(180deg,#0e0d10,#09080a); border-right:1px solid var(--line); padding:22px 14px;
  overflow-y:auto; height:100vh; position:sticky; top:0; display:flex; flex-direction:column; gap:3px; }
.ww-embed nav{ padding-top:128px; padding-bottom:84px; } /* clear the shell's user dock */
.brand{ font:700 1.35rem/1.15 "Cinzel",serif; color:var(--tx-hi); margin:0 6px; }
.brand small{ display:block; font:500 11px "Inter"; color:var(--gold-lit); letter-spacing:.24em; text-transform:uppercase; margin-top:7px; }
.rule{ height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); opacity:.45; margin:14px 0 10px; }
.nav-item{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:8px 10px; border-radius:8px;
  border:0; background:none; cursor:pointer; color:var(--tx-mid); }
.nav-item:hover{ background:var(--bg-hover); color:var(--tx-hi); }
.nav-item[aria-current="true"]{ background:var(--gold-soft); color:var(--tx-hi); box-shadow:inset 2px 0 0 var(--gold-lit); }
.nav-item .n{ margin-left:auto; font-size:12px; font-variant-numeric:tabular-nums; }
.nav-item .canon{ font-size:10px; color:var(--violet-lit); letter-spacing:.06em; }
.nav-add{ margin-top:6px; border:1px dashed var(--line-2); border-radius:8px; background:none; color:var(--tx-mid);
  padding:7px 10px; cursor:pointer; text-align:left; }
.nav-add:hover{ color:var(--gold-lit); border-color:rgba(217,160,70,0.45); }
.newsec{ display:grid; gap:6px; margin-top:6px; }
.newsec input{ background:var(--bg-2); border:1px solid var(--line-2); border-radius:7px; padding:7px 9px; }
.engine{ margin:2px 0 6px; padding:10px; border:1px solid var(--line); border-radius:10px; font-size:12.5px; color:var(--tx-mid); display:grid; gap:6px; }
.engine select{ width:100%; }
.sync{ font-size:12px; color:var(--tx-low); }
.dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--tx-low); margin-right:6px; vertical-align:middle; }
.dot.ok{ background:var(--s-game); } .dot.bad{ background:var(--s-redo); }

/* main */
main{ min-width:0; padding:0 30px 60px; height:100vh; overflow-y:auto; }
.ww-embed main{ padding-top:110px; }
.bar{ position:sticky; top:0; z-index:3; background:var(--bg-0); padding:16px 0 12px; display:flex; flex-wrap:wrap; gap:8px;
  align-items:center; border-bottom:1px solid var(--line); }
#q{ flex:1 1 220px; background:var(--bg-2); border:1px solid var(--line-2); border-radius:8px; padding:8px 11px; }
.chip{ background:var(--bg-2); border:1px solid var(--line-2); border-radius:999px; padding:5px 11px; cursor:pointer; font-size:13px; }
.chip[aria-pressed="true"]{ border-color:var(--gold-lit); background:var(--gold-soft); }
.btn{ background:var(--bg-2); border:1px solid var(--line-2); border-radius:8px; padding:7px 13px; cursor:pointer; }
.btn:hover{ border-color:var(--tx-mid); }
.btn.primary{ background:linear-gradient(180deg,var(--gold-bright),var(--gold-lit)); border-color:transparent; color:#1a1206; font-weight:600; }
.btn.danger{ color:var(--s-redo); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
header.sec{ display:grid; grid-template-columns:1fr auto; gap:18px; align-items:end; padding:26px 0 8px; }
header.sec h1{ font-size:clamp(26px,3vw,38px); line-height:1.05; }
header.sec p{ margin:8px 0 0; color:var(--tx-mid); max-width:70ch; font-style:italic; }
.canonbox{ margin:16px 0 4px; padding:14px 16px; border:1px solid rgba(157,107,255,0.3); border-radius:12px; background:rgba(124,58,237,0.07); }
.canonbox h4{ margin:0 0 6px; font:600 12px "Inter"; letter-spacing:.14em; text-transform:uppercase; color:var(--violet-lit); }
.canonbox ol{ margin:6px 0 0; padding-left:20px; }
h2.group{ font-size:1.15rem; margin:26px 0 10px; display:flex; gap:10px; align-items:baseline; }
h2.group span{ font:400 12.5px "Inter"; color:var(--tx-mid); }
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; margin-top:14px; }
.card{ background:var(--bg-2); border:1px solid var(--line); border-radius:12px; display:flex; flex-direction:column; text-align:left;
  cursor:pointer; padding:12px 14px 14px; gap:7px; transition:border-color .15s, transform .15s; }
.card:hover{ border-color:var(--line-2); transform:translateY(-2px); }
.card h3{ font-size:15px; overflow-wrap:anywhere; }
.card .ex{ margin:0; color:var(--tx-mid); font-size:13px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; }
.tags{ display:flex; gap:5px; flex-wrap:wrap; }
.pill{ font-size:11.5px; border-radius:999px; padding:1px 8px; border:1px solid currentColor; white-space:nowrap; }
.s-idea{ color:var(--s-idea); } .s-agreed{ color:var(--s-agreed); } .s-work{ color:var(--s-work); } .s-game{ color:var(--s-game); } .s-redo{ color:var(--s-redo); }
.flag{ font-size:11px; background:var(--violet-lit); color:#120c1e; border-radius:4px; padding:0 6px; }
.add{ border:1px dashed var(--line-2); border-radius:12px; background:none; color:var(--tx-mid); cursor:pointer; min-height:110px; }
.add:hover{ color:var(--gold-lit); border-color:rgba(217,160,70,0.45); }
.empty{ color:var(--tx-mid); padding:30px 0; font-style:italic; }
.locked{ max-width:560px; margin:18vh auto 0; text-align:center; display:grid; gap:14px; justify-items:center; }
.locked p{ color:var(--tx-mid); margin:0; }

/* leaf (editor) */
.leaf{ position:fixed; inset:0 0 0 auto; width:min(720px,100vw); background:var(--bg-1); border-left:1px solid var(--line-2);
  box-shadow:-20px 0 50px #0009; z-index:10; display:flex; flex-direction:column; transform:translateX(105%); transition:transform .22s ease; }
.leaf.open{ transform:none; }
.scrim{ position:fixed; inset:0; background:#0007; z-index:9; display:none; }
.scrim.open{ display:block; }
.leaf-head{ padding:18px 22px 12px; border-bottom:1px solid var(--line); display:grid; gap:10px; }
.ww-embed .leaf-head{ padding-top:110px; }
.kicker{ font-size:12px; color:var(--tx-mid); letter-spacing:.12em; text-transform:uppercase; }
#e-title{ font:600 1.6rem/1.15 "Cinzel",serif; color:var(--tx-hi); background:transparent; border:1px solid transparent; border-radius:8px; padding:2px 6px; margin-left:-6px; width:100%; }
#e-title:hover,#e-title:focus{ border-color:var(--line-2); background:#0003; }
.row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
select{ background:var(--bg-2); border:1px solid var(--line-2); border-radius:8px; padding:6px 9px; }
.leaf-body{ overflow-y:auto; padding:14px 22px 20px; display:grid; gap:14px; flex:1; align-content:start; }
.field{ display:grid; gap:5px; }
.field label{ font-size:12px; color:var(--tx-mid); letter-spacing:.06em; text-transform:uppercase; display:flex; gap:8px; align-items:center; }
.field label .canon{ text-transform:none; letter-spacing:0; color:var(--violet-lit); }
.shown{ border:1px solid transparent; border-radius:8px; padding:6px 8px; margin:0 -8px; cursor:text; min-height:1.6em; overflow-wrap:anywhere; }
.shown:hover{ border-color:var(--line-2); background:#0003; }
.shown.blank{ color:var(--tx-low); font-style:italic; }
.shown table{ border-collapse:collapse; font-size:13px; margin:6px 0; display:block; overflow-x:auto; }
.shown th,.shown td{ border:1px solid var(--line-2); padding:4px 7px; text-align:left; vertical-align:top; }
.shown p{ margin:0 0 8px; } .shown ul,.shown ol{ margin:0 0 8px; padding-left:20px; }
.shown code,.shown pre{ font-family:"JetBrains Mono",monospace; font-size:12.5px; background:#0004; border-radius:4px; }
.shown pre{ padding:8px; white-space:pre-wrap; }
.shown h4{ margin:8px 0 4px; font-size:14px; }
textarea{ width:100%; background:#0b0a0d; border:1px solid var(--line-2); border-radius:8px; padding:8px 10px; resize:vertical; min-height:70px; line-height:1.5; }
.note textarea{ border-color:rgba(157,107,255,0.4); }
.leaf-foot{ border-top:1px solid var(--line); padding:12px 22px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.leaf-foot .msg{ margin-left:auto; font-size:13px; color:var(--tx-mid); }
.ww-embed .leaf-foot{ padding-right:140px; } /* clear the shell's "?" and bug fabs */
.newfield{ display:flex; gap:8px; }
.newfield input{ flex:1; background:var(--bg-2); border:1px solid var(--line-2); border-radius:8px; padding:6px 9px; }
/* files on a card */
.card .thumb{ width:calc(100% + 28px); margin:-12px -14px 2px; aspect-ratio:16/9; object-fit:cover; border-radius:12px 12px 0 0; background:var(--bg-1); }
.field.files .file{ display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--line); }
.field.files .file img{ width:72px; height:48px; object-fit:cover; border-radius:6px; display:block; }
.field.files .file .ico{ width:72px; text-align:center; font-size:22px; }
.field.files .fname{ flex:1; overflow-wrap:anywhere; color:var(--tx); }
.field.files .file .btn{ padding:2px 8px; }
.field.files > .btn{ justify-self:start; margin-top:8px; cursor:pointer; }

/* canon vs game, game picker */
.navh{ margin:14px 6px 4px; font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--tx-low); }
.navh:first-child{ margin-top:0; }
#gamepick{ width:100%; margin:0 0 4px; font-family:"Cinzel",serif; color:var(--gold-bright); }
.canon-pill{ color:var(--violet-lit); }
.muted{ color:var(--tx-mid); font-size:13px; }
.hint{ text-transform:none; letter-spacing:0; color:var(--tx-mid); }
.newgame{ max-width:560px; margin:8vh auto 0; display:grid; gap:14px; }
.newgame .field span{ font-size:12px; color:var(--tx-mid); letter-spacing:.06em; text-transform:uppercase; }
.newgame input{ background:var(--bg-2); border:1px solid var(--line-2); border-radius:8px; padding:9px 11px; }

/* import + production plan */
.pmsg{ margin:10px 0 4px; color:var(--tx); }
.pmsg.err{ color:var(--s-redo); }
.psec{ margin-top:22px; }
.imp{ display:flex; gap:10px; align-items:flex-start; padding:8px 10px; border:1px solid var(--line); border-radius:9px; margin:6px 0; background:var(--bg-2); cursor:pointer; }
.imp input{ margin-top:4px; accent-color:var(--gold-lit); }
.ready{ display:flex; align-items:center; gap:12px; margin:6px 0 10px; font-size:13px; color:var(--tx-mid); }
.ready__bar{ flex:0 1 260px; height:8px; border-radius:6px; background:var(--bg-3); overflow:hidden; }
.ready__bar i{ display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-bright)); }
.gsecs{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:8px; }
.gsec{ padding:9px 11px; border:1px solid var(--line); border-radius:9px; background:var(--bg-2); }
.g-solid{ color:var(--s-game); } .g-partial{ color:var(--s-work); } .g-missing{ color:var(--s-redo); }
.p-blocker{ color:var(--s-redo); } .p-important{ color:var(--s-work); } .p-nice{ color:var(--s-idea); }
.contra li{ margin:4px 0; }
.q{ display:grid; gap:8px; padding:14px; margin:10px 0; border:1px solid var(--line-2); border-radius:12px; background:var(--bg-2); }
.q__q{ color:var(--tx-hi); font-weight:500; }
.qa{ padding:8px 0; border-bottom:1px solid var(--line); }
details summary{ cursor:pointer; }
h3.sub{ font-size:1rem; margin:20px 0 6px; }
.ms{ margin:16px 0; padding:14px 16px; border:1px solid var(--line-2); border-radius:12px; background:var(--bg-1); }
.ms h3{ font-size:1.05rem; margin-bottom:6px; }
.ms p{ margin:4px 0; }
.gate{ color:var(--gold-bright); }
.task{ padding:9px 0; border-top:1px solid var(--line); }
.task__d{ color:var(--tx); font-size:14px; margin-top:4px; white-space:pre-wrap; }
.task pre{ white-space:pre-wrap; background:#0005; padding:10px; border-radius:8px; font:12.5px/1.5 "JetBrains Mono",monospace; }
.mono{ font-family:"JetBrains Mono",monospace; color:var(--tx-mid); }

@media (max-width:820px){
  body{ grid-template-columns:1fr; }
  nav{ position:static; height:auto; flex-direction:row; flex-wrap:wrap; padding:12px 16px; }
  .brand,.rule,.engine{ display:none; }
  .nav-item{ width:auto; }
  main{ height:auto; padding:0 16px 40px; }
  header.sec{ grid-template-columns:1fr; }
}
@media (prefers-reduced-motion:reduce){ .leaf,.card{ transition:none; } }
</style>
</head>
<body>
<nav aria-label="Розділи" id="spine">
  <div class="brand"><span id="w-title">…</span><small id="t-brand">Біблія гри</small></div>
  <div class="rule"></div>
  <select id="gamepick" aria-label="Гра"></select>
  <div class="engine" id="engine-box">
    <label for="engine" id="t-engine">Рушій гри</label>
    <select id="engine"></select>
    <div class="sync" id="sync"><span class="dot"></span>…</div>
  </div>
  <div id="nav"></div>
  <div id="newsec-slot"></div>
</nav>
<main id="main">
  <div class="bar" role="toolbar">
    <input id="q" type="search" />
    <div id="statuses" class="row"></div>
    <button class="btn" id="imp-btn"></button>
    <input type="file" id="imp-file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden />
  </div>
  <div id="view"></div>
</main>
<div class="scrim" id="scrim"></div>
<aside class="leaf" id="leaf" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="leaf-head">
    <div class="kicker" id="e-kicker"></div>
    <input id="e-title" />
    <div class="row">
      <select id="e-status"></select>
    </div>
  </div>
  <div class="leaf-body" id="e-body"></div>
  <div class="leaf-foot">
    <button class="btn primary" id="e-save"></button>
    <button class="btn" id="e-close"></button>
    <button class="btn danger" id="e-delete"></button>
    <span class="msg" id="e-msg"></span>
  </div>
</aside>

<script src="ww-embed.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<script src="firebase/firebase-init.js"></script>
<script src="firebase/token-budget.js"></script>
<script src="gamebible.js"></script>
</body>
</html>
