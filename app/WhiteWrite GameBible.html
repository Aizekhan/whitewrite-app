<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WhiteWrite — Біблія світу</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
@font-face{ font-family:"Philosopher"; src:url("assets/fonts/Philosopher-Regular.woff2") format("woff2"); font-weight:400; font-style:normal; font-display:swap; }
@font-face{ font-family:"Philosopher"; src:url("assets/fonts/Philosopher-Bold.woff2") format("woff2"); font-weight:600 700; font-style:normal; font-display:swap; }
@font-face{ font-family:"Philosopher"; src:url("assets/fonts/Philosopher-Italic.woff2") format("woff2"); font-weight:400; font-style:italic; font-display:swap; }
@font-face{ font-family:"Philosopher"; src:url("assets/fonts/Philosopher-BoldItalic.woff2") format("woff2"); font-weight:600 700; font-style:italic; font-display:swap; }
/* Game Bible of a world: a spine of sections on the left, the cards of one section
   on the right, an editing leaf sliding over. Canon sections (characters, locations,
   factions, items) are the world's own entities with game fields added on them. */
:root{
  --bg-0:#070608; --bg-1:#101012; --bg-2:#16161a; --bg-3:#1d1d22; --bg-hover:#232329;
  --line:rgba(255,255,255,0.08); --line-2:rgba(255,255,255,0.14);
  /* one accent: gold - primary button, selected item, focus */
  --gold:#d97706; --gold-lit:#f0a93b; --gold-bright:#f6cf7e; --gold-soft:rgba(240,169,59,0.12);
  --tx-hi:#f3efe7; --tx:#c7c2bb; --tx-mid:#9a958d; --tx-low:#77726a;
  /* statuses: idea grey, agreed blue, in work teal, in game green, redo/error red; a warning is yellow and always has a sign */
  --s-idea:#9a958d; --s-agreed:#6ca8f0; --s-work:#4fb3c8; --s-game:#5fbf8a; --s-redo:#ef5d58; --warn:#e9cf63;
  --serif:"Philosopher",Georgia,serif; --brand:"Cinzel","Philosopher",Georgia,serif;
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--bg-0); }
body{ color:var(--tx); font:15px/1.55 "Inter",system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  display:grid; grid-template-columns:260px 1fr; }
button,input,select,textarea{ font:inherit; color:inherit; }
h1,h2,h3{ font-family:var(--serif); font-weight:700; color:var(--tx-hi); margin:0; letter-spacing:0; }
:focus-visible{ outline:2px solid var(--gold-lit); outline-offset:2px; border-radius:5px; }
.ww-embed body{ padding-top:0; }
/* scrollbars in the house style: thin, dark, gold on hover */
*{ scrollbar-width:thin; scrollbar-color:#2c2a30 transparent; }
*::-webkit-scrollbar{ width:9px; height:9px; }
*::-webkit-scrollbar-track{ background:transparent; }
*::-webkit-scrollbar-thumb{ background:#2c2a30; border:2px solid transparent; background-clip:padding-box; border-radius:9px; }
*::-webkit-scrollbar-thumb:hover{ background:rgba(240,169,59,0.55); background-clip:padding-box; }
*::-webkit-scrollbar-corner{ background:transparent; }

/* spine */
nav{ background:linear-gradient(180deg,#0e0d10,#09080a); border-right:1px solid var(--line); padding:22px 14px;
  overflow-y:auto; height:100vh; position:sticky; top:0; display:flex; flex-direction:column; gap:3px; }
.ww-embed nav{ margin-top:118px; height:calc(100vh - 118px); padding-top:14px; padding-bottom:84px;
  -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 18px); mask-image:linear-gradient(to bottom, transparent 0, #000 18px); } /* scrolls below the shell's logo, clears its user dock */
.brand{ font:700 1.35rem/1.15 var(--brand); color:var(--tx-hi); margin:0 6px; }
.brand small{ display:block; font:500 11px "Inter"; color:var(--gold-lit); letter-spacing:.24em; text-transform:uppercase; margin-top:7px; }
.rule{ height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); opacity:.45; margin:14px 0 10px; }
.nav-item{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:8px 10px; border-radius:8px;
  border:0; background:none; cursor:pointer; color:var(--tx-mid); }
.nav-item:hover{ background:var(--bg-hover); color:var(--tx-hi); }
/* menu: group names in the service's Cinzel, warm and quiet (no white bold); the open group is gold, the others step back
   (#nav.has-open) until hovered; sub-items in a lighter Inter on a faint gold guide line */
.nav-grp .arr{ display:inline-flex; transition:transform .18s, opacity .18s; opacity:.55; margin-right:-4px; }
.nav-grp[aria-expanded="true"] .arr{ transform:rotate(90deg); opacity:1; }
.nav-grp, .nav-top{ font-family:var(--serif); font-weight:400; font-size:15px; letter-spacing:0; color:var(--tx); padding-top:7px; padding-bottom:7px; transition:color .18s, opacity .18s; }
.nav-top{ padding-left:30px; }
.nav-grp[aria-expanded="true"]{ color:var(--gold-lit); font-weight:600; }
#nav.has-open .nav-grp:not([aria-expanded="true"]), #nav.has-open .nav-top:not([aria-current="true"]){ color:var(--tx-low); font-weight:400; }
#nav.has-open .nav-grp:not([aria-expanded="true"]):hover, #nav.has-open .nav-top:hover{ color:var(--tx); }
.nav-subs{ display:flex; flex-direction:column; gap:1px; margin:0 0 8px 17px; padding-left:8px; border-left:1px solid rgba(240,169,59,.22); }
.nav-sub{ padding:5px 10px; font-size:13px; font-weight:400; color:var(--tx-mid); }
.nav-sub[aria-current="true"]{ color:var(--gold-bright); font-weight:500; }
.nav-item[aria-current="true"]{ background:linear-gradient(90deg, rgba(217,119,6,.16), rgba(217,119,6,.03)); color:var(--tx-hi); box-shadow:inset 2px 0 0 var(--gold-lit); }
.nav-top[aria-current="true"]{ color:var(--gold-bright); }
.nav-item .n{ margin-left:auto; font-family:"Inter",sans-serif; font-size:11.5px; font-weight:400; letter-spacing:0; color:var(--tx-low); font-variant-numeric:tabular-nums; }
.nav-item .canon{ font-size:10px; color:var(--gold-lit); letter-spacing:.06em; }
.nav-add{ margin-top:6px; border:1px dashed var(--line-2); border-radius:8px; background:none; color:var(--tx-mid);
  padding:7px 10px; cursor:pointer; text-align:left; }
.nav-add:hover{ color:var(--gold-lit); border-color:rgba(240,169,59,0.45); }
.newsec{ display:grid; gap:6px; margin-top:6px; }
.newsec input{ background:var(--bg-2); border:1px solid var(--line-2); border-radius:7px; padding:7px 9px; }
/* world block folds away (arrow), the game picker follows it, project settings close the menu */
.navtoggle{ display:flex; align-items:center; gap:6px; width:calc(100% - 12px); background:none; border:0; cursor:pointer; padding:0; text-align:left; }
.navtoggle:hover{ color:var(--gold-lit); }
.navtoggle .arr{ display:inline-grid; place-items:center; width:26px; height:26px; border-radius:7px; color:var(--gold-bright);
  background:var(--gold-soft); border:1px solid rgba(240,169,59,.4); transition:transform .15s, background .15s; flex:none; }
.navtoggle:hover .arr{ background:rgba(217,119,6,.28); }
.navtoggle{ gap:9px; font-size:11.5px; }
.navtoggle[aria-expanded="false"] .arr{ transform:rotate(-90deg); }
/* a game's GDD: its name under «Канон світу»; the World Bible: «Повʼязані ігри» at the foot of the canon */
.navh.gamehead{ margin:14px 6px 8px; font-family:var(--brand); font-size:15px; letter-spacing:.04em; text-transform:none; color:var(--gold-bright); }
.navh.navgames{ margin-top:22px; padding-top:14px; border-top:1px solid var(--line-2); }
.nav-item.nav-game{ font-size:13.5px; }
.pickgames{ display:grid; gap:8px; margin:10px 0; } .pickgames .btn{ justify-content:flex-start; text-align:left; }
#nav-foot{ margin-top:auto; padding-top:14px; }
#nav-foot .nav-item{ border-top:1px solid var(--line); border-radius:0 0 8px 8px; padding-top:10px; }
/* project settings */
.setbox{ border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin:16px 0; display:grid; gap:12px; background:var(--bg-1); }
.setbox h2{ margin:0; font-size:18px; }
.setrow{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.setrow input, .setrow select{ flex:1 1 240px; background:var(--bg-2); border:1px solid var(--line-2); border-radius:8px; padding:8px 10px; }
.setbox .hint{ margin:0; font-size:13px; color:var(--tx-mid); }
.setbox.danger{ border-color:rgba(239,93,88,.4); background:rgba(239,93,88,.05); }
.secrow{ display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--line); }
.secrow span{ flex:1; }
.aicost{ display:inline-block; margin-left:5px; font-size:10px; line-height:1; color:var(--gold-bright); vertical-align:super; opacity:.85; cursor:help; }
.btn.primary .aicost{ color:inherit; }
.commt{ border-top:1px solid var(--line, rgba(255,255,255,.08)); padding-top:12px; margin-top:12px; display:grid; gap:8px; }
.commt h3{ margin:0; font-size:15px; }
.commt input[data-cf], .commt textarea{ width:100%; background:var(--bg-2); border:1px solid var(--line-2); border-radius:8px; padding:8px 10px; color:var(--tx-hi); font:inherit; }
.commt textarea{ resize:vertical; line-height:1.5; }
.commteam{ font-weight:600; }
/* Спільнота: what is shown is ticked first; a big gold tick (the world, each game, «Шукаю команду») */
.commpick{ display:grid; gap:8px; margin:10px 0 4px; } .commpick h3{ margin:0 0 2px; font-size:15px; }
.bigcheck{ display:flex; align-items:center; gap:12px; padding:10px 14px; border:1px solid var(--line-2, rgba(255,255,255,.12)); border-radius:12px; background:var(--bg-2); cursor:pointer; min-width:0; }
.bigcheck:hover{ border-color:rgba(240,169,59,.55); }
.bigcheck input{ position:absolute; opacity:0; width:1px; height:1px; }
.bigcheck__box{ flex:none; width:28px; height:28px; border-radius:8px; border:2px solid rgba(240,169,59,.7); background:rgba(0,0,0,.25); display:grid; place-items:center; transition:background .15s, border-color .15s; }
.bigcheck__box::after{ content:""; width:8px; height:15px; border:solid #1c1308; border-width:0 3.5px 3.5px 0; transform:rotate(45deg) translate(-1px,-2px); opacity:0; transition:opacity .15s; }
.bigcheck input:checked + .bigcheck__box{ background:linear-gradient(180deg,var(--gold-bright),var(--gold-lit)); border-color:var(--gold-lit); }
.bigcheck input:checked + .bigcheck__box::after{ opacity:1; }
.bigcheck input:focus-visible + .bigcheck__box{ outline:2px solid var(--gold-lit); outline-offset:3px; }
.bigcheck__t{ font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.commst{ margin-left:auto; flex:none; font-size:12.5px; color:var(--tx-mid); white-space:nowrap; }
.commplan{ margin:4px 0 0; } .commin{ margin:0; color:var(--gold-lit); }
.commteam-more{ display:grid; gap:8px; } .commteam-more[hidden]{ display:none; }
@media (max-width:560px){ .bigcheck{ flex-wrap:wrap; } .commst{ margin-left:40px; } .bigcheck__t{ white-space:normal; } .commteam .bigcheck__t{ white-space:nowrap; font-size:13.5px; } }
.commcov{ display:flex; flex-wrap:wrap; gap:8px; }
.commcov label{ cursor:pointer; }
.commcov input{ position:absolute; opacity:0; }
.commcov img{ width:84px; height:56px; object-fit:cover; border-radius:6px; border:2px solid transparent; display:block; }
.commcov input:checked + img{ border-color:var(--gold); }
.commcov input:focus-visible + img{ outline:2px solid var(--gold); outline-offset:2px; }
.shownsecs{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:4px 14px; }
.chip[aria-pressed="true"]{ box-shadow:inset 0 0 0 1px var(--gold-lit); }
.ask-box .warn{ margin:0; font-size:13.5px; color:var(--tx-mid); line-height:1.5; }
.ask-box .warn b{ color:var(--tx-hi); }
.ask-box .msg{ white-space:pre-line; color:var(--tx-hi); font-size:15px; }
.sync{ font-size:12px; color:var(--tx-low); }
.dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--tx-low); margin-right:6px; vertical-align:middle; }
.dot.ok{ background:var(--s-game); } .dot.bad{ background:var(--s-redo); }

/* main */
main{ min-width:0; padding:0 30px 60px; height:100vh; overflow-y:auto; }
.ww-embed main{ margin-top:118px; height:calc(100vh - 118px); } /* scrolls below the shell's logo, never under it */
.bar{ position:sticky; top:0; z-index:3; background:var(--bg-0); padding:16px 0 12px; display:flex; flex-wrap:wrap; gap:8px;
  align-items:center; border-bottom:1px solid var(--line); }
.bar[hidden]{ display:none; }
.srch-btn{ position:absolute; right:12px; top:20px; z-index:2; width:32px; height:32px; display:grid; place-items:center; border-radius:8px; border:1px solid var(--line-2);
  background:var(--bg-2); color:var(--gold-lit); cursor:pointer; }
.srch-btn[aria-expanded="true"]{ border-color:var(--gold-lit); background:var(--gold-soft); }
.ww-embed .srch-btn{ top:12px; }
.brand{ padding-right:34px; }
.guide-next{ margin:12px 4px 4px; padding:10px 12px; border:1px dashed rgba(240,169,59,.5); border-radius:10px; font-size:12.5px; color:var(--tx-mid); line-height:1.45; }
.guide-next b{ color:var(--gold-lit); font-weight:600; } .guide-next small{ display:block; margin-top:4px; color:var(--tx-low); font-size:12px; }
.guide-row{ align-items:center; justify-content:space-between; gap:12px; margin:4px 0 10px; } .guide-row > span{ font-size:13.5px; color:var(--tx-mid); }
.ico-btn{ display:inline-grid; place-items:center; width:36px; height:36px; padding:0; flex:none; color:var(--gold-lit); }
.ico-btn svg{ width:19px; height:19px; }
#q{ flex:1 1 220px; background:var(--bg-2); border:1px solid var(--line-2); border-radius:8px; padding:8px 11px; }
.chip{ background:var(--bg-2); border:1px solid var(--line-2); border-radius:999px; padding:5px 11px; cursor:pointer; font-size:13px; }
.chip[aria-pressed="true"]{ border-color:var(--gold-lit); background:var(--gold-soft); }
.btn{ background:var(--bg-2); border:1px solid var(--line-2); border-radius:8px; padding:7px 13px; cursor:pointer; }
.btn:hover{ border-color:var(--tx-mid); }
.btn.primary{ background:linear-gradient(180deg,var(--gold-bright),var(--gold-lit)); border-color:transparent; color:#1a1206; font-weight:600; }
.btn.danger{ color:var(--s-redo); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
header.sec{ display:grid; grid-template-columns:1fr auto; gap:18px; align-items:end; padding:26px 0 8px; }
header.sec h1{ font-size:clamp(26px,3vw,38px); line-height:1.05; }
header.sec p{ margin:8px 0 0; color:var(--tx-mid); max-width:70ch; font-style:italic; }
/* «Огляд світу»: the world's cover first (the same as its card in «Світи»), 16:9 */
/* the world hub panel (?panel=1, an iframe beside the world card in White.html): mini-tabs on the left, no menu */
.ww-panel body{ display:block; background:transparent; }
.ww-panel nav, .ww-panel .topline, .ww-panel .bar{ display:none !important; }
.ww-panel main, .ww-embed.ww-panel main{ margin:0; height:auto; padding:0; overflow:visible; }
.hub{ display:block; } /* the tabs are the shell's (White.html .wtabs) */
.hub__body{ min-width:0; border:1px solid var(--line-2); border-radius:14px; background:var(--bg-1); padding:16px 18px; }
.hub__body h2{ font-size:20px; margin-bottom:6px; } .hub__h3{ font-size:15px; margin:16px 0 8px; } .hub__msg{ margin-top:12px; color:var(--gold-lit); }
.hub__body .setbox{ border:0; padding:0; margin:0; background:none; } .hub__body .setbox > h2{ display:none; }
.tm{ border:1px solid var(--line-2); border-radius:10px; padding:10px 12px; margin:10px 0; }
.tm__h{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; } .tm__h .muted{ flex:1; font-size:12.5px; }
.tm__secs{ margin-top:10px; max-height:300px; overflow:auto; border-top:1px solid var(--line); }
.tm__sh, .tm__row{ display:grid; grid-template-columns:1fr 90px 100px; align-items:center; padding:5px 0; border-bottom:1px solid var(--line); }
.tm__sh{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--tx-low); position:sticky; top:0; background:var(--bg-1); }
.tm__row input{ justify-self:start; } .tm-roles{ margin:6px 0 12px; padding-left:18px; }
.mk-soon{ border:1px dashed rgba(240,169,59,.5); background:rgba(240,169,59,.06); border-radius:12px; padding:12px 14px; margin:8px 0 12px; } .mk-soon p{ margin:6px 0 0; line-height:1.6; } .mk-soon .hint a{ color:var(--gold-lit); }
.mk-state, .mk-form{ margin-top:10px; } .mk-stripe{ margin-top:14px; padding-top:10px; border-top:1px solid var(--line); }
.mk-form .imp{ display:flex; gap:10px; align-items:flex-start; } .mk-form .imp input{ width:auto; margin:3px 0 0; flex:none; } .hub__body .hint a{ color:var(--gold-lit); }
.ok{ color:var(--s-game); }

/* «Огляд світу»: the world's name (or its title image) centred on the bar, ✎ for the owner on hover only */
h1.wname{ position:relative; text-align:center; font:700 clamp(30px,3.6vw,52px)/1.1 var(--brand); color:var(--tx-hi); letter-spacing:.04em; padding:0 44px; }
h1.wname img{ max-width:100%; max-height:110px; object-fit:contain; vertical-align:middle; }
.vstop{ position:absolute; right:10px; bottom:10px; z-index:3; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; cursor:pointer;
  color:var(--gold-bright); background:rgba(22,15,8,.78); border:1px solid rgba(240,169,59,.5); backdrop-filter:blur(4px); transition:.15s; }
.vstop:hover{ color:var(--tx-hi); border-color:rgba(240,169,59,.85); }
.vstop svg{ width:15px; height:15px; fill:currentColor; }
/* 👤 followers · ★ rating beside the world / game name */
.wwstats{ display:inline-flex; gap:10px; margin-left:14px; vertical-align:middle; font:600 13px/1 "Inter",system-ui,sans-serif; letter-spacing:0; color:var(--gold-lit); }
.wwstats > span{ display:inline-flex; align-items:center; gap:5px; padding:4px 9px 4px 7px; border-radius:999px; border:1px solid rgba(240,169,59,.35); background:rgba(30,22,10,.55); }
.wwstats svg{ width:14px; height:14px; fill:currentColor; }
h1.wname .wwstats{ position:absolute; left:0; top:50%; transform:translateY(-50%); margin:0; }
h1.wname:has(.wwstats){ padding:0 140px; }
@media (max-width:820px){ h1.wname .wwstats{ position:static; transform:none; display:flex; justify-content:center; margin-top:8px; } h1.wname:has(.wwstats){ padding:0 44px; } }
.ww-embed .topline h1.wname{ font-size:clamp(30px,3.4vw,50px); overflow:visible; }
.wname__ed{ position:absolute; right:0; top:50%; transform:translateY(-50%); opacity:0; transition:opacity .15s; border:1px solid var(--line-2); background:var(--bg-2);
  color:var(--gold-lit); border-radius:8px; width:34px; height:34px; font-size:16px; cursor:pointer; }
h1.wname:hover .wname__ed, .wname__ed:focus-visible{ opacity:1; }
.wcover__ed{ position:absolute; right:10px; top:10px; z-index:3; width:34px; height:34px; border-radius:8px; border:1px solid var(--line-2); background:rgba(14,11,16,.72);
  color:var(--gold-lit); font-size:16px; cursor:pointer; opacity:0; transition:opacity .15s; }
.wcover:hover .wcover__ed, .wcover__ed:focus-visible{ opacity:1; }
.fillbox{ margin:0 0 18px; } .fillbox > summary{ cursor:pointer; font:700 16px/1.3 var(--serif); color:var(--gold-lit); }
.fillbox .hint{ margin:8px 0 4px; } .fillfolder{ margin:14px 0 6px; padding-bottom:12px; border-bottom:1px solid var(--line); } .fillfolder .btn .aicost{ color:inherit; } .fillsteps{ margin:8px 0 0; padding-left:22px; display:grid; gap:12px; } .fillsteps li > span{ display:block; margin-bottom:6px; }
.fillbox input[type=checkbox]{ width:auto; padding:0; } .fillres .imp{ display:flex; gap:8px; align-items:center; background:none; border:0; padding:0; }
.fillsteps .row{ gap:8px; flex-wrap:wrap; align-items:center; } .fillres{ margin-top:12px; padding:10px 12px; border:1px solid var(--line-2); border-radius:10px; display:grid; gap:6px; } .fillres p{ margin:0; }
.wcover__guide{ position:absolute; right:52px; top:10px; z-index:3; height:34px; padding:0 12px; border-radius:8px; border:1px solid var(--line-2); background:rgba(14,11,16,.72);
  color:var(--tx-mid); font:600 13px/1 Inter,sans-serif; cursor:pointer; }
.wcover__guide.is-on{ color:var(--gold-lit); border-color:rgba(240,169,59,.6); }
@media (hover:none){ .wname__ed, .wcover__ed{ opacity:1; } } /* phones and tablets have no hover: the ✎ is always there */
header.wsec{ grid-template-columns:1fr; } header.wsec p{ margin-left:auto; margin-right:auto; text-align:center; }
.wn-prev{ display:grid; place-items:center; min-height:120px; margin:8px 0; border:1px dashed var(--line-2); border-radius:10px; background:#0b0a0d; padding:8px; }
.wn-prev img{ max-width:100%; object-fit:contain; }
.wn-line{ display:flex; align-items:center; justify-content:center; outline:1px dashed rgba(240,169,59,.25); } .wn-line img{ max-height:100%; } .wn-font{ font:700 34px var(--brand); color:var(--tx-hi); text-align:center; }
.wcover{ aspect-ratio:16/9; max-height:56vh; width:100%; border-radius:14px; overflow:hidden; position:relative; border:1px solid var(--line-2); background:#0b0a0d; margin:0 0 18px; }
.wcover img,.wcover video{ width:100%; height:100%; object-fit:cover; display:block; }

@media (max-width:900px){ .medgrid{ grid-template-columns:minmax(0,1fr); gap:0; } .mout{ position:static; max-height:none; overflow:visible; padding:0; } .mol{ display:none; } .mol-sel{ display:block; } .mol-add{ margin:0 0 10px; padding:0; } }

.rc-del{ color:var(--s-redo); text-decoration:line-through; background:rgba(239,93,88,.08); } .rc-ins{ color:var(--s-game); background:rgba(95,191,138,.1); }

.scrim.open{ display:block; }

.ww-embed .leaf-head{ padding-top:110px; }

/* field structure editing: the small gold pencil in the card's top-left corner; red and pulsing while on */
.leaf-head{ position:relative; }
.editbtn{ position:absolute; top:12px; left:12px; width:28px; height:28px; border-radius:50%; display:grid; place-items:center; padding:0; cursor:pointer;
  color:var(--gold-lit); background:var(--gold-soft); border:1px solid rgba(240,169,59,.5); transition:background .15s, color .15s, border-color .15s; }

.fhead{ display:flex; gap:6px; align-items:center; }
.fhead .flabel{ flex:1; min-width:0; background:var(--bg-2); border:1px solid var(--line-2); border-radius:7px; padding:5px 8px; font-size:13px; }

.fdel{ flex:none; width:28px; height:28px; border-radius:7px; border:1px solid rgba(239,93,88,.5); background:rgba(239,93,88,.08); color:var(--s-redo); cursor:pointer; }
.fdel:hover{ background:rgba(239,93,88,.2); }
.field.editing{ border:1px dashed rgba(239,93,88,.35); border-radius:10px; padding:8px; }
.newfield select{ flex:none; }
/* table fields */
.tbl{ overflow-x:auto; }

.fimgs{ display:flex; flex-wrap:wrap; gap:8px; }
.fimg{ position:relative; }
.fimg img{ width:120px; height:80px; object-fit:cover; border-radius:7px; display:block; border:1px solid var(--line-2); }

.fimg button[data-frame]{ right:auto; left:3px; }
.kicker{ font-size:12px; color:var(--tx-mid); letter-spacing:.12em; text-transform:uppercase; }
#e-title,#d-title{ font:700 28px/34px var(--serif); color:var(--tx-hi); background:transparent; border:1px solid transparent; border-radius:8px; padding:2px 6px; margin-left:-6px; width:100%; }
#e-title:hover,#e-title:focus,#d-title:hover,#d-title:focus{ border-color:var(--line-2); background:#0003; }
.row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
select{ background:var(--bg-2); border:1px solid var(--line-2); border-radius:8px; padding:6px 9px; }

.field{ display:grid; gap:5px; }

/* 3D viewer (gb-3d.js) */
.card{ position:relative; }

.gtag{ position:relative; cursor:pointer; }

body.is-dragging, body.is-dragging *{ cursor:grabbing !important; user-select:none; }

/* Історія і хроніка: comets over the time line */
.unitbox{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--tx-mid); }
.unitbox input{ width:90px; background:var(--bg-2); border:1px solid var(--line-2); border-radius:8px; padding:6px 9px; color:var(--tx-hi); }
.chron{ overflow-x:auto; margin:10px 0 6px; border:1px solid var(--line); border-radius:14px;

.chron .span{ position:absolute; height:6px; border-radius:3px; background:rgba(240,169,59,.35); }
.comet{ position:absolute; width:0; height:0; border:none; background:none; padding:0; cursor:pointer; color:inherit; }

  background:radial-gradient(circle at 40% 40%,#fff,var(--gold-bright) 35%,var(--gold) 70%); box-shadow:0 0 14px 4px rgba(246,207,126,.55),0 0 30px 8px rgba(217,119,6,.25); }

  background:linear-gradient(90deg,transparent,rgba(240,169,59,.25) 30%,rgba(246,207,126,.85)); }

  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%); box-shadow:none; filter:drop-shadow(0 0 6px var(--gold-lit)); }

.comet .lbl b{ font:700 13px var(--serif); color:var(--tx-hi); text-shadow:0 1px 4px #000; overflow-wrap:anywhere; }

.av{ display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; object-fit:cover; flex:none; background:var(--bg-3);
  border:1px solid var(--line-2); color:var(--gold-bright); font:600 11px "Inter"; }
.dlink.who[aria-pressed="true"]{ border-color:var(--gold); background:var(--gold-soft); }
.dlink.who[aria-pressed="false"]{ opacity:.6; }
.evrow{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }

.evrow input{ background:var(--bg-2); border:1px solid var(--line-2); border-radius:8px; padding:7px 9px; color:var(--tx-hi); font-size:14px; }
.card.story{ cursor:default; } .card.story .btn{ align-self:flex-start; margin-top:auto; }

/* world dossier: tabs at the bottom, life timeline with hanging notes */
.card .sub{ margin:-4px 0 0; font-size:12.5px; color:var(--gold-lit); }
.dtabs[hidden]{ display:none; } #statuses[hidden]{ display:none; } #ng-minrow[hidden],#ng-cbox[hidden]{ display:none; }
.dtabs{ display:flex; gap:4px; padding:8px 14px 0; border-top:1px solid var(--line); overflow-x:auto; flex:none; }

.dpanel textarea{ width:100%; }
.dsub{ margin:4px 0 6px; font:600 12px "Inter"; letter-spacing:.12em; text-transform:uppercase; color:var(--tx-mid); }

.nav-toggle{ display:none; }

.sroad{ list-style:none; margin:4px 0 0; padding:0; position:relative; }
.sroad::before{ content:""; position:absolute; left:17px; top:18px; bottom:24px; width:2px;
