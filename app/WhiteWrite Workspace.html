<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>White Tree — Production Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  /* surfaces */
  --bg-0:#0a0a0b;        /* deepest canvas */
  --bg-1:#101012;        /* rails / topbar */
  --bg-2:#16161a;        /* cards */
  --bg-3:#1d1d22;        /* raised / inputs */
  --bg-hover:#232329;
  --line:rgba(255,255,255,0.07);
  --line-2:rgba(255,255,255,0.12);
  /* accents */
  --gold:#d97706;
  --gold-lit:#f0a93b;
  --gold-soft:rgba(217,119,6,0.14);
  --violet:#7c3aed;
  --violet-lit:#9d6bff;
  --violet-soft:rgba(124,58,237,0.16);
  /* text */
  --tx-hi:#f3efe7;
  --tx:#c7c2bb;
  --tx-mid:#8a857e;
  --tx-low:#5d5953;
  /* status */
  --st-draft:#e0564f;
  --st-review:#e0a829;
  --st-ready:#3fae6e;
  --st-done:#5b8def;
  /* radii / shadow */
  --r:14px;
  --r-sm:9px;
  --shadow:0 18px 44px rgba(0,0,0,0.5);
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg-0); color:var(--tx);
  font-family:"Inter",system-ui,sans-serif; font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; }
#root{ height:100%; }
::selection{ background:var(--gold-soft); color:#fff; }

/* scrollbars */
*::-webkit-scrollbar{ width:11px; height:11px; }
*::-webkit-scrollbar-thumb{ background:#26262c; border:3px solid transparent;
  background-clip:padding-box; border-radius:10px; }
*::-webkit-scrollbar-thumb:hover{ background:#34343c; background-clip:padding-box; }

h1,h2,h3,h4{ font-family:"Cinzel",serif; font-weight:600; color:var(--tx-hi);
  margin:0; letter-spacing:.02em; }

button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
.mono{ font-family:"JetBrains Mono",monospace; }
:focus-visible{ outline:2px solid var(--gold-lit); outline-offset:2px; border-radius:5px; }

/* ============================ SHELL ============================ */
.shell{ display:block; height:100%;
  background:
    radial-gradient(120% 80% at 100% 0%, rgba(124,58,237,0.06), transparent 55%),
    radial-gradient(90% 70% at 0% 100%, rgba(217,119,6,0.05), transparent 50%),
    var(--bg-0); }

/* ---- sidebar ---- */
.rail{ background:var(--bg-1); border-right:1px solid var(--line);
  display:flex; flex-direction:column; min-height:0; }
.rail__brand{ display:flex; align-items:center; gap:11px; padding:22px 22px 18px; }
.rail__logo{ width:34px; height:34px; flex:0 0 auto; display:grid; place-items:center;
  color:var(--gold-lit); }
.rail__name{ font-family:"Cinzel",serif; font-weight:700; font-size:18px;
  color:var(--tx-hi); letter-spacing:.06em; line-height:1; }
.rail__tag{ font-size:9.5px; letter-spacing:.34em; text-transform:uppercase;
  color:var(--tx-low); margin-top:4px; }
.rail__sep{ height:1px; background:var(--line); margin:4px 16px 14px; }

.nav{ display:flex; flex-direction:column; gap:3px; padding:0 12px; }
.nav__lbl{ font-size:10px; letter-spacing:.24em; text-transform:uppercase;
  color:var(--tx-low); padding:8px 12px 7px; }
.nav__item{ display:flex; align-items:center; gap:13px; width:100%;
  padding:11px 13px; border-radius:var(--r-sm); color:var(--tx-mid);
  position:relative; transition:background .18s, color .18s; text-align:left; }
.nav__item svg{ width:19px; height:19px; flex:0 0 auto; }
.nav__item:hover{ background:var(--violet-soft); color:var(--tx-hi); }
.nav__item.is-on{ background:var(--gold-soft); color:var(--gold-lit); }
.nav__item.is-on::before{ content:""; position:absolute; left:-12px; top:50%;
  transform:translateY(-50%); width:3px; height:21px; border-radius:0 3px 3px 0;
  background:var(--gold-lit); box-shadow:0 0 12px rgba(240,169,59,0.6); }
.nav__item-label{ font-weight:500; font-size:14.5px; flex:1; }
.nav__count{ font-size:11px; font-weight:600; color:var(--tx-low);
  background:var(--bg-3); border-radius:20px; padding:2px 8px; }
.nav__item.is-on .nav__count{ color:var(--gold-lit); background:rgba(217,119,6,0.18); }

/* ===================== VISUAL CANON (Director) ===================== */
.vk-seg{ display:flex; gap:4px; background:var(--bg-2); border:1px solid var(--line); border-radius:11px; padding:4px; }
.vk-seg__b{ display:inline-flex; align-items:center; gap:8px; padding:9px 15px; border-radius:8px; font-size:13.5px;
  font-weight:500; color:var(--tx-mid); transition:.18s; }
.vk-seg__b svg{ width:16px; height:16px; }
.vk-seg__b:hover{ color:var(--tx-hi); }
.vk-seg__b.is-on{ background:var(--gold-soft); color:var(--gold-lit); }

.vk-note-bar{ display:flex; align-items:center; gap:11px; margin-bottom:20px; padding:12px 15px; border-radius:var(--r);
  background:var(--violet-soft); border:1px solid rgba(157,107,255,0.22); font-size:13px; color:var(--tx); }
.vk-note-bar b{ color:var(--tx-hi); font-weight:600; }

.vk-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(258px,1fr)); gap:18px; }
.vk{ display:flex; flex-direction:column; background:var(--bg-2); border:1px solid var(--line); border-radius:12px;
  overflow:hidden; transition:border-color .2s, transform .2s, box-shadow .2s; }
.vk:hover{ border-color:var(--line-2); transform:translateY(-2px); box-shadow:0 14px 34px rgba(0,0,0,0.34); }
.vk__main{ position:relative; background-color:var(--bg-3); background-size:cover; background-position:center; }
.vk__hero::part(frame){ background:transparent; border:none; }
.vk__hero{ display:block; width:100%; height:178px; color:var(--gold-lit); }
.vk__model{ position:absolute; top:10px; left:10px; z-index:2; backdrop-filter:blur(6px); }
.vk__b{ padding:13px 14px 14px; }
.vk__row{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
.vk__name{ font-family:"Cinzel",serif; font-weight:600; font-size:16px; color:var(--tx-hi); line-height:1.15; }
.vk__refs{ font-size:11.5px; color:var(--tx-low); flex:0 0 auto; }
.vk__bar{ height:5px; border-radius:3px; background:rgba(255,255,255,0.08); overflow:hidden; margin:8px 0 2px; }
.vk__barfill{ height:100%; border-radius:3px; transition:width .4s ease; }
.vk__barfill.is-none{ background:var(--st-draft); }
.vk__barfill.is-draft{ background:var(--st-review); }
.vk__barfill.is-good{ background:var(--st-ready); }
.vk-mng__grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(58px,1fr)); gap:8px; max-height:240px; overflow-y:auto; }
.vk-mng__cell{ position:relative; aspect-ratio:1; border-radius:8px; display:grid; place-items:center;
  background:linear-gradient(135deg, rgba(217,119,6,0.2), rgba(124,58,237,0.16)); border:1px solid rgba(217,160,70,0.4); }
.vk-mng__n{ font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--gold-lit); }
.vk-mng__del{ position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; cursor:pointer;
  display:grid; place-items:center; background:var(--st-draft); color:#fff; border:1px solid rgba(0,0,0,0.3); }
.vk-mng__del svg{ width:11px; height:11px; }
.vk-mng__empty{ grid-column:1/-1; text-align:center; padding:24px; color:var(--tx-mid); font-style:italic; font-size:13px; }
.vk-mng__cell--pending{ border-style:dashed; border-color:rgba(157,107,255,0.5);
  background:linear-gradient(135deg, rgba(124,58,237,0.18), rgba(157,107,255,0.1)); animation:pendPulse 1.6s ease-in-out infinite; }
.vk-mng__cell--pending .vk-mng__n{ color:var(--violet-lit); }
@keyframes pendPulse{ 0%,100%{ opacity:.6 } 50%{ opacity:1 } }
.vk-pending{ margin-top:14px; padding:13px 14px; border-radius:10px;
  background:var(--violet-soft); border:1px solid rgba(157,107,255,0.3); }
.vk-pending__t{ display:block; font-size:12.5px; color:var(--violet-lit); margin-bottom:10px; }
.vk__angles{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:12px 0; }
.vk__angle{ display:flex; flex-direction:column; gap:4px; }
.vk__anglefill{ display:block; width:100%; aspect-ratio:1; border-radius:6px; color:var(--tx-low); }
.vk__angle-lbl{ font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--tx-low); text-align:center; }
.vk__note{ display:flex; gap:8px; align-items:flex-start; margin:0 0 13px; font-size:12.5px; line-height:1.5;
  color:var(--tx-mid); font-style:italic; }
.vk__note svg{ flex:0 0 auto; margin-top:2px; }
.vk__hint{ font-size:11.5px; line-height:1.45; color:var(--tx-low); font-style:italic; margin:0 0 11px; }
.vk__anglefill.is-filled::part(frame){ background:linear-gradient(135deg, rgba(217,119,6,0.2), rgba(124,58,237,0.16)); border-style:solid; border-color:rgba(217,160,70,0.5); }
.vk__acts{ display:flex; gap:8px; }
.vk__acts .btn svg{ margin:0; }

/* unified pillar switcher */
.pillswitch{ display:inline-flex; gap:4px; padding:5px; border-radius:13px;
  background:rgba(14,12,16,0.72); border:1px solid var(--line); }
.pillswitch__b{ display:inline-flex; align-items:center; gap:8px; padding:8px 13px; border-radius:9px;
  font-size:13.5px; font-weight:500; color:var(--tx-mid); border:1px solid transparent; transition:.18s; cursor:pointer; }
.pillswitch__b svg{ width:16px; height:16px; }
.pillswitch__b:hover{ color:var(--gold-lit); background:var(--violet-soft); }
.pillswitch__b.is-here{ color:var(--gold-lit); background:var(--gold-soft); border-color:rgba(217,119,6,0.3);
  font-family:"Cinzel",serif; font-weight:600; cursor:default; }
.pillswitch__b.is-here:hover{ background:var(--gold-soft); }
@media (max-width:720px){
  .pillswitch__b{ font-size:0; padding:9px; gap:0; }
  .pillswitch__b svg{ width:18px; height:18px; }
}

/* image-slot empty states — intentional, not holes */
image-slot::part(frame){ background:rgba(255,255,255,0.03); border:1px dashed var(--line-2); }
.vk__anglefill::part(frame){ background:rgba(255,255,255,0.022); }
.spin-ring{ width:22px; height:22px; border-radius:50%; border:2px solid var(--gold-soft);
  border-top-color:var(--gold-lit); animation:spinr .9s linear infinite; }
@keyframes spinr{ to{ transform:rotate(360deg); } }



.rail__foot{ margin-top:auto; padding:16px; }
.proj{ background:var(--bg-2); border:1px solid var(--line); border-radius:var(--r-sm);
  padding:14px; }
.proj__k{ font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--tx-low); }
.proj__name{ font-family:"Cinzel",serif; font-weight:600; color:var(--tx-hi);
  font-size:15px; margin-top:3px; }
.proj__meta{ display:flex; gap:14px; margin-top:11px; }
.proj__stat{ font-size:12px; color:var(--tx-mid); }
.proj__stat b{ color:var(--tx-hi); font-weight:600; }

/* ---- topbar ---- */
.main{ min-width:0; display:flex; flex-direction:column; min-height:0; height:100%; }
.topbar{ min-height:66px; flex:0 0 auto; border-bottom:1px solid var(--line); position:relative; z-index:100;
  background:rgba(16,16,18,0.82); backdrop-filter:blur(14px);
  display:flex; align-items:center; gap:14px; padding:0 22px; flex-wrap:wrap; }
.dir-tabs{ display:flex; gap:5px; padding:4px; border-radius:11px; background:var(--bg-2); border:1px solid var(--line); }
.dir-tab{ display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:8px;
  font-size:13.5px; font-weight:500; color:var(--tx-mid); border:1px solid transparent; cursor:pointer; transition:.16s; }
.dir-tab svg{ width:16px; height:16px; }
.dir-tab:hover{ color:var(--tx-hi); }
.dir-tab.is-on{ color:var(--gold-lit); background:var(--gold-soft); border-color:rgba(217,119,6,0.3); }
  display:flex; align-items:center; gap:18px; padding:0 28px; position:sticky; top:0; z-index:20; }
.crumb{ display:flex; align-items:center; gap:9px; font-size:13px; color:var(--tx-mid);
  min-width:0; }
.crumb__proj{ color:var(--tx-mid); }
.crumb__sep{ color:var(--tx-low); }
.scene-pick{ display:flex; align-items:center; gap:9px; background:var(--bg-2);
  border:1px solid var(--line-2); border-radius:var(--r-sm); padding:7px 12px;
  color:var(--tx-hi); font-weight:500; font-size:14px; transition:border-color .2s; }
.scene-pick:hover, .scene-pick.is-open{ border-color:var(--gold); }
.scene-pick svg{ width:15px; height:15px; color:var(--tx-mid); }
.scene-pick .num{ color:var(--gold-lit); font-family:"Cinzel",serif; font-weight:600; }
.scene-pickwrap{ position:relative; z-index:200; }
.scene-menu{ position:absolute; top:calc(100% + 8px); left:0; min-width:300px; max-height:60vh; overflow-y:auto; z-index:200;
  padding:6px; background:linear-gradient(180deg, rgba(26,24,30,0.99), rgba(18,17,21,0.99));
  border:1px solid var(--line-2); border-radius:12px; box-shadow:var(--shadow); }
.scene-opt{ display:flex; align-items:center; gap:11px; width:100%; padding:10px 11px; border-radius:8px;
  color:var(--tx); font-size:13.5px; cursor:pointer; transition:.15s; text-align:left; }
.scene-opt:hover{ background:var(--bg-hover); color:var(--tx-hi); }
.scene-opt.is-on{ background:var(--gold-soft); color:var(--gold-lit); }
.scene-opt__n{ display:inline-grid; place-items:center; width:24px; height:24px; border-radius:7px; flex:0 0 auto;
  background:var(--bg-3); border:1px solid var(--line); font-family:"JetBrains Mono",monospace; font-size:12px; }
.scene-opt.is-on .scene-opt__n{ background:rgba(217,119,6,0.2); border-color:rgba(217,119,6,0.4); }
.scene-opt__t{ flex:1; font-family:"Cinzel",serif; font-weight:600; }
.scene-opt__act{ font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--tx-low); flex:0 0 auto; }
.topbar__spacer{ flex:1; }
.topbar__btn{ display:flex; align-items:center; gap:8px; font-weight:500; font-size:13.5px;
  padding:9px 15px; border-radius:var(--r-sm); transition:.2s; }
.topbar__btn svg{ width:16px; height:16px; }
.topbar__btn--ghost{ color:var(--tx-mid); border:1px solid var(--line-2); }
.topbar__btn--ghost:hover{ color:var(--tx-hi); border-color:var(--violet); background:var(--violet-soft); }
.topbar__btn--gold{ color:#1a1206; font-weight:600;
  background:linear-gradient(180deg,var(--gold-lit),var(--gold));
  box-shadow:0 6px 18px rgba(217,119,6,0.3); }
.topbar__btn--gold:hover{ filter:brightness(1.07); transform:translateY(-1px); }

/* ---- content scroll area ---- */
.content{ flex:1; min-height:0; overflow-y:auto; padding:30px 34px 60px; }
.page{ max-width:1180px; margin:0 auto; animation:fade .4s ease both; }
@keyframes fade{ from{ opacity:0; transform:translateY(8px) } to{ opacity:1; transform:none } }

/* section header */
.phead{ display:flex; align-items:flex-end; justify-content:space-between; gap:20px;
  margin-bottom:6px; }
.phead__l{ display:flex; flex-direction:column; gap:6px; }
.phead__kick{ font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--gold); }
.phead h1{ font-size:27px; }
.phead__sub{ color:var(--tx-mid); font-size:14px; }
.pdiv{ height:1px; background:var(--line); margin:18px 0 24px; }

/* generic building blocks */
.card{ background:var(--bg-2); border:1px solid var(--line); border-radius:var(--r); }
.btn{ display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:500;
  padding:8px 13px; border-radius:var(--r-sm); transition:.18s; border:1px solid var(--line-2);
  color:var(--tx); }
.btn svg{ width:15px; height:15px; }
.btn:hover{ border-color:var(--violet); background:var(--violet-soft); color:var(--tx-hi); }
.btn--gold{ border-color:transparent; color:#1a1206; font-weight:600;
  background:linear-gradient(180deg,var(--gold-lit),var(--gold)); }
.btn--gold:hover{ filter:brightness(1.07); background:linear-gradient(180deg,var(--gold-lit),var(--gold)); }
.btn--add{ width:100%; justify-content:center; padding:14px; border-style:dashed;
  border-color:var(--line-2); color:var(--tx-mid); background:transparent; }
.btn--add:hover{ border-color:var(--gold); color:var(--gold-lit); background:var(--gold-soft); }

.chip{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:500;
  padding:4px 9px; border-radius:20px; background:var(--bg-3); color:var(--tx-mid);
  border:1px solid var(--line); }
.chip--mood{ color:var(--violet-lit); border-color:rgba(124,58,237,0.35); background:var(--violet-soft); }
.chip--gold{ color:var(--gold-lit); border-color:rgba(217,119,6,0.35); background:var(--gold-soft); }

.pill{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600;
  padding:4px 10px; border-radius:20px; letter-spacing:.02em; }
.pill::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
.pill--draft{ color:var(--st-draft); background:rgba(224,86,79,0.13); }
.pill--review{ color:var(--st-review); background:rgba(224,168,41,0.13); }
.pill--ready{ color:var(--st-ready); background:rgba(63,174,110,0.13); }
.pill--done{ color:var(--st-done); background:rgba(91,141,239,0.13); }

/* 16:9 placeholder */
.frame{ position:relative; aspect-ratio:16/9; border-radius:var(--r-sm); overflow:hidden;
  background:#1d1a22 url(assets/ph-shot.jpg) center/cover no-repeat;
  border:1px solid var(--line); display:grid; place-items:center; }
.frame__c{ display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--gold-lit);
  background:rgba(10,8,12,0.55); padding:10px 14px; border-radius:8px; backdrop-filter:blur(2px); }
.frame__c svg{ width:30px; height:30px; }
.frame__lbl{ font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.05em; }
.frame__tag{ position:absolute; top:9px; left:9px; font-family:"JetBrains Mono",monospace;
  font-size:10px; color:var(--tx-mid); background:rgba(0,0,0,0.5); padding:3px 7px; border-radius:5px; }

/* drag handle */
.grip{ display:grid; gap:3px; cursor:grab; padding:4px; color:var(--tx-low); }
.grip i{ width:13px; height:1.5px; background:currentColor; border-radius:2px; display:block; }
.grip:hover{ color:var(--tx-mid); }

/* progress bar */
.prog{ height:6px; border-radius:6px; background:var(--bg-3); overflow:hidden; }
.prog__fill{ height:100%; border-radius:6px;
  background:linear-gradient(90deg,var(--violet),var(--gold)); }

.empty-note{ color:var(--tx-low); font-size:13px; font-style:italic; }

/* small icon button */
.ibtn{ display:grid; place-items:center; width:30px; height:30px; border-radius:7px;
  color:var(--tx-low); transition:.18s; }
.ibtn svg{ width:16px; height:16px; }
.ibtn:hover{ background:var(--bg-hover); color:var(--tx-hi); }

/* key/value list */
.kv{ display:flex; flex-direction:column; gap:0; }
.kv__row{ display:grid; grid-template-columns:108px 1fr; gap:14px; padding:7px 0;
  font-size:13.5px; align-items:baseline; }
.kv__row span{ color:var(--tx-mid); font-size:12px; letter-spacing:.02em; }
.kv__row b{ color:var(--tx-hi); font-weight:500; }
.kv--lined .kv__row{ border-bottom:1px solid var(--line); }
.kv--lined .kv__row:last-child{ border-bottom:none; }

/* section subhead */
.sec-h{ display:flex; align-items:center; gap:9px; font-size:15px; margin:30px 0 14px;
  color:var(--tx-hi); }

/* stat row */
.stat-row{ display:flex; gap:14px; margin-top:20px; }
.stat{ flex:1; background:var(--bg-2); border:1px solid var(--line); border-radius:var(--r-sm);
  padding:14px 16px; display:flex; flex-direction:column; gap:3px; }
.stat__n{ font-family:"Cinzel",serif; font-weight:700; font-size:24px; color:var(--tx-hi); }
.stat__l{ font-size:12px; color:var(--tx-mid); }

/* scene number dot */
.scene-dot{ display:inline-grid; place-items:center; width:24px; height:24px; border-radius:7px;
  background:var(--bg-3); border:1px solid var(--line); font-size:12px; font-weight:600;
  color:var(--tx-mid); font-family:"JetBrains Mono",monospace; }

/* ===================== DIRECTOR ===================== */
.shot-list{ display:flex; flex-direction:column; gap:16px; }
.shot{ overflow:hidden; }
.shot__bar{ display:flex; align-items:center; gap:12px; padding:13px 16px;
  border-bottom:1px solid var(--line); background:var(--bg-1); }
.shot__no{ font-family:"Cinzel",serif; font-weight:700; font-size:14px; color:var(--gold-lit);
  letter-spacing:.06em; }
.shot__type{ font-size:13.5px; color:var(--tx-hi); font-weight:500; }
.shot__moods{ display:flex; gap:6px; }
.shot__dlg{ display:flex; align-items:center; gap:9px; margin-top:12px; padding:9px 12px; border-radius:9px;
  background:rgba(124,58,237,0.08); border:1px solid rgba(157,107,255,0.26); width:100%; text-align:left; }
.shot__dlg__tag{ font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--violet-lit);
  background:rgba(124,58,237,0.16); border-radius:20px; padding:3px 9px; flex:0 0 auto; }
.shot__dlg__who{ font-family:"Cinzel",serif; font-weight:600; font-size:13px; color:var(--tx-hi); flex:0 0 auto; }
.shot__dlg__line{ flex:1; min-width:0; font-size:13.5px; color:var(--tx); font-style:italic; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.shot__dlg__dur{ font-size:11px; color:var(--violet-lit); flex:0 0 auto; }
.shot__dlg--add{ cursor:pointer; color:var(--tx-mid); font-size:13px; justify-content:center; background:none; border:1px dashed var(--line-2); transition:.18s; }
.shot__dlg--add:hover{ color:var(--violet-lit); border-color:rgba(157,107,255,0.5); background:rgba(124,58,237,0.06); }
.shot__acts{ margin-left:auto; display:flex; gap:4px; }
.shot__body{ display:grid; grid-template-columns:300px 1fr; gap:20px; padding:18px; }
.shot__detail{ display:flex; flex-direction:column; gap:14px; }
.prompt{ background:var(--bg-1); border:1px solid var(--line); border-radius:var(--r-sm);
  padding:13px 14px; }
.prompt__head{ margin-bottom:8px; }
.prompt__lbl{ display:inline-flex; align-items:center; gap:6px; font-size:11px;
  letter-spacing:.16em; text-transform:uppercase; color:var(--violet-lit); }
.prompt__txt{ margin:0 0 12px; font-size:12.5px; line-height:1.65; color:var(--tx);
  background:var(--bg-0); border:1px solid var(--line); border-radius:7px; padding:11px 12px; }
.prompt__acts{ display:flex; gap:9px; }

/* ===================== CHARACTERS ===================== */
.char-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
.char-c{ padding:18px; display:flex; flex-direction:column; }
.char-c__top{ display:flex; align-items:center; gap:13px; }
.avatar{ width:48px; height:48px; border-radius:13px; flex:0 0 auto; display:grid; place-items:center;
  font-family:"Cinzel",serif; font-weight:700; font-size:17px; color:var(--h);
  background:color-mix(in srgb, var(--h) 14%, var(--bg-3)); border:1px solid color-mix(in srgb, var(--h) 40%, transparent); }
.char-c__id{ flex:1; min-width:0; }
.char-c__name{ font-family:"Cinzel",serif; font-weight:600; font-size:16.5px; color:var(--tx-hi); }
.char-c__role{ font-size:12px; color:var(--tx-mid); letter-spacing:.02em; }
.char-c__mot{ margin:14px 0 16px; font-size:13.5px; line-height:1.55; color:var(--tx); }
.char-c__arc-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px; }
.arc-lbl{ font-size:12.5px; color:var(--tx-mid); font-style:italic; }
.arc-pct{ font-size:12.5px; font-weight:600; color:var(--gold-lit); font-family:"JetBrains Mono",monospace; }
.char-c__scenes{ display:flex; align-items:center; gap:7px; margin-top:16px; flex-wrap:wrap; }
.char-c__scenes-lbl{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--tx-low); margin-right:2px; }

/* ---- character profile modal ---- */
.modal-scrim{ position:fixed; inset:0; z-index:200; display:grid; place-items:center;
  padding:40px 20px; background:rgba(6,6,8,0.66); backdrop-filter:blur(7px);
  animation:scrimIn .25s ease both; }
@keyframes scrimIn{ from{ opacity:0 } to{ opacity:1 } }
.modal{ width:min(640px,100%); max-height:calc(100vh - 80px); overflow-y:auto;
  background:var(--bg-2); border:1px solid var(--line-2); border-radius:var(--r);
  box-shadow:var(--shadow); animation:modalIn .3s cubic-bezier(.2,.7,.2,1) both; }
@keyframes modalIn{ from{ opacity:0; transform:translateY(14px) scale(.985) } to{ opacity:1; transform:none } }
.modal__head{ position:relative; display:flex; align-items:center; gap:16px;
  padding:24px 56px 22px 24px; border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, color-mix(in srgb, var(--h) 11%, var(--bg-2)), var(--bg-2)); }
.modal__avatar{ width:64px; height:64px; border-radius:16px; flex:0 0 auto; display:grid; place-items:center;
  font-family:"Cinzel",serif; font-weight:700; font-size:23px; color:var(--h);
  background:color-mix(in srgb, var(--h) 16%, var(--bg-3)); border:1px solid color-mix(in srgb, var(--h) 42%, transparent); }
.modal__id{ flex:1; min-width:0; }
.modal__name{ font-family:"Cinzel",serif; font-weight:600; font-size:23px; color:var(--tx-hi); line-height:1.12; }
.modal__role{ font-size:13px; color:var(--tx-mid); margin-top:6px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.modal__close{ position:absolute; top:16px; right:16px; width:34px; height:34px; border-radius:9px;
  display:grid; place-items:center; color:var(--tx-mid); border:1px solid var(--line); transition:.18s; }
.modal__close:hover{ color:var(--tx-hi); border-color:var(--line-2); background:var(--bg-hover); }
.modal__close svg{ width:18px; height:18px; }
.modal__body{ padding:22px 24px 26px; display:flex; flex-direction:column; gap:22px; }
.msec__h{ font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--tx-low);
  margin-bottom:11px; display:flex; align-items:center; gap:8px; }
.msec__h svg{ width:14px; height:14px; color:var(--gold); }
.msec__txt{ font-size:14.5px; line-height:1.62; color:var(--tx); margin:0; }
.mrel{ display:flex; flex-direction:column; gap:8px; }
.mrel__row{ display:flex; align-items:center; gap:11px; padding:11px 13px;
  background:var(--bg-3); border:1px solid var(--line); border-radius:var(--r-sm); }
.mrel__dot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
.mrel__name{ font-weight:600; color:var(--tx-hi); font-size:13.5px; }
.mrel__kind{ margin-left:auto; font-size:12px; color:var(--tx-mid); font-style:italic; }
.mscene{ display:flex; align-items:center; gap:11px; padding:9px 12px;
  background:var(--bg-3); border:1px solid var(--line); border-radius:var(--r-sm); }
.mscene__t{ flex:1; min-width:0; font-size:13.5px; color:var(--tx-mid); }
.mscene__t b{ color:var(--tx-hi); font-weight:600; }

.relgraph{ width:100%; height:auto; display:block; }
.rel-name{ font-family:"Inter",sans-serif; font-size:12.5px; font-weight:600; fill:var(--tx-hi);
  text-anchor:middle; dominant-baseline:central; }
.rel-hub{ fill:var(--gold-lit); font-family:"Cinzel",serif; }
.rel-kind{ font-size:10.5px; font-weight:600; text-anchor:middle; letter-spacing:.04em; }

/* ===================== LOCATIONS ===================== */
.loc-grid{ display:grid; grid-template-columns:1fr 300px; gap:18px; align-items:start; }
.loc-main{ padding:18px; }
.loc-main__head{ margin-bottom:13px; }
.loc-main__frame{ margin-bottom:16px; }
.loc-main__name{ font-size:23px; }
.loc-main__type{ color:var(--tx-mid); font-size:13.5px; margin-top:3px; }
.loc-main__pills{ display:flex; gap:7px; flex-wrap:wrap; margin:13px 0; }
.loc-main__desc{ font-size:14px; line-height:1.6; color:var(--tx); margin:0 0 16px; }
.loc-main__scenes{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.moodboard{ margin-top:18px; border-top:1px solid var(--line); padding-top:16px; }
.moodboard__head{ display:flex; align-items:center; gap:8px; font-size:12px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--tx-mid); margin-bottom:12px; }
.moodboard__row{ display:grid; grid-template-columns:repeat(3,1fr) 1.1fr; gap:10px; }
.mb-thumb{ aspect-ratio:1; border-radius:9px; background:var(--bg-3); border:1px solid var(--line);
  display:grid; place-items:center; color:var(--tx-low); }
.mb-palette{ display:grid; grid-template-rows:repeat(3,1fr); grid-auto-flow:column; gap:5px;
  border-radius:9px; overflow:hidden; }
.mb-palette span{ border-radius:5px; min-height:22px; }
.loc-main__acts{ display:flex; gap:10px; margin-top:18px; }

.loc-side{ position:sticky; top:14px; }
.loc-side__lbl{ font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--tx-low);
  margin-bottom:11px; padding-left:4px; }
.loc-list{ display:flex; flex-direction:column; gap:6px; }
.loc-row{ display:flex; align-items:center; gap:11px; width:100%; padding:12px 13px;
  border-radius:var(--r-sm); border:1px solid var(--line); background:var(--bg-2);
  color:var(--tx); text-align:left; transition:.18s; }
.loc-row svg{ width:18px; height:18px; color:var(--tx-mid); flex:0 0 auto; }
.loc-row__name{ flex:1; font-size:13.5px; font-weight:500; }
.loc-row:hover{ border-color:var(--violet); background:var(--violet-soft); }
.loc-row.is-cur{ border-color:var(--gold); background:var(--gold-soft); }
.loc-row.is-cur svg{ color:var(--gold-lit); }
.loc-row.is-cur .loc-row__name{ color:var(--gold-lit); }
.loc-row__cur{ font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-lit);
  background:rgba(217,119,6,0.2); padding:3px 7px; border-radius:20px; }

/* ===================== MEMORY ===================== */
.mem-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start; }
.mem-col{ display:flex; flex-direction:column; gap:18px; }
.mem-card{ padding:18px; }
.mem-card__h{ display:flex; align-items:center; gap:9px; font-family:"Cinzel",serif;
  font-weight:600; font-size:15px; color:var(--tx-hi); margin-bottom:14px; }
.mem-card__h svg{ width:18px; height:18px; }
.mem-rules{ margin-top:14px; display:flex; flex-direction:column; gap:9px; }
.mem-rule{ display:flex; gap:10px; font-size:13px; line-height:1.5; color:var(--tx); }
.mem-rule__dot{ width:5px; height:5px; border-radius:50%; background:var(--gold); flex:0 0 auto; margin-top:7px; }
.threads{ display:flex; flex-direction:column; }
.thread{ display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); }
.thread:last-child{ border-bottom:none; }
.thread__ic{ display:grid; place-items:center; }
.thread__ic svg{ width:18px; height:18px; }
.thread__t{ flex:1; font-size:13.5px; color:var(--tx-hi); }
.thread__st{ font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; }
.notes{ display:flex; flex-direction:column; gap:9px; }
.note{ display:flex; gap:11px; align-items:flex-start; padding:11px 13px; border-radius:9px;
  background:color-mix(in srgb, var(--nc) 8%, var(--bg-1)); border:1px solid color-mix(in srgb, var(--nc) 26%, transparent);
  border-left:3px solid var(--nc); }
.note__ic{ color:var(--nc); }
.note__ic svg{ width:17px; height:17px; }
.note__t{ font-size:13px; line-height:1.5; color:var(--tx); }

/* ===================== TIMELINE ===================== */
.track{ display:flex; gap:10px; }
.track__act{ flex:1; background:var(--bg-2); border:1px solid var(--line); border-radius:var(--r-sm);
  padding:14px; }
.track__act-lbl{ font-family:"Cinzel",serif; font-weight:600; font-size:13px; color:var(--tx-mid);
  letter-spacing:.06em; margin-bottom:12px; }
.track__blocks{ display:flex; gap:8px; flex-wrap:wrap; }
.track__block{ position:relative; width:46px; height:46px; border-radius:10px; display:grid;
  place-items:center; font-family:"JetBrains Mono",monospace; font-weight:600; font-size:14px;
  background:var(--bg-3); border:1px solid var(--line); color:var(--tx-mid); cursor:pointer; transition:.18s; }
.track__block:hover{ transform:translateY(-2px); border-color:var(--violet); }
.track__block.st-done{ color:var(--st-ready); border-color:rgba(63,174,110,0.4); }
.track__block.st-draft{ color:var(--st-draft); border-color:rgba(224,86,79,0.4); }
.track__block.st-review{ color:var(--st-review); border-color:rgba(224,168,41,0.4); }
.track__block.is-cur{ background:var(--gold-soft); border-color:var(--gold); color:var(--gold-lit);
  box-shadow:0 0 0 3px rgba(217,119,6,0.16); }
.track__here{ position:absolute; top:-9px; left:50%; transform:translateX(-50%);
  font-family:"Inter",sans-serif; font-size:8.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  white-space:nowrap; color:#1a1206; background:var(--gold-lit); padding:2px 6px; border-radius:20px; }
.tension{ width:100%; height:150px; display:block; }
.tension__axis{ display:flex; justify-content:space-between; padding:8px 12px 4px;
  font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--tx-low); }
.scn-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
.scn{ padding:15px 16px; }
.scn--big{ background:linear-gradient(180deg, var(--gold-soft), var(--bg-2) 60%); }
.scn--cur{ border-color:rgba(217,119,6,0.4); }
.scn__top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; }
.scn__no{ font-family:"Cinzel",serif; font-weight:600; font-size:12.5px; color:var(--gold-lit); letter-spacing:.04em; }
.scn__title{ font-family:"Cinzel",serif; font-weight:600; font-size:17px; color:var(--tx-hi); margin-bottom:11px; }
.scn__meta{ display:flex; gap:16px; flex-wrap:wrap; }
.scn__meta span{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--tx-mid); }
.scn__foot{ display:flex; align-items:center; justify-content:space-between; margin-top:13px;
  padding-top:13px; border-top:1px solid var(--line); }
.scn__words{ font-size:12px; color:var(--tx-mid); font-family:"JetBrains Mono",monospace; }
.scn__acts{ display:flex; gap:8px; }

/* shot editor modal */
.shotmodal{ position:fixed; inset:0; z-index:90; display:grid; place-items:center; padding:24px;
  background:rgba(6,5,8,0.72); backdrop-filter:blur(6px); animation:smIn .2s ease both; }
@keyframes smIn{ from{ opacity:0 } to{ opacity:1 } }
.shotmodal__card{ width:min(520px,94vw); max-height:88vh; overflow-y:auto; padding:22px 24px;
  border-radius:16px; background:linear-gradient(180deg,#1b1722,#131017); border:1px solid var(--line-2);
  box-shadow:0 30px 70px rgba(0,0,0,0.6); }
.shotmodal__head{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:18px; }
.shotmodal__k{ font-size:10.5px; letter-spacing:.24em; text-transform:uppercase; color:var(--gold-lit); }
.shotmodal__t{ font-family:"Cinzel",serif; font-size:22px; color:var(--tx-hi); margin-top:5px; }
.shotmodal__x{ width:34px; height:34px; border-radius:9px; display:grid; place-items:center; cursor:pointer;
  color:var(--tx-mid); border:1px solid var(--line); }
.shotmodal__x:hover{ color:var(--tx-hi); border-color:var(--line-2); }
.shotmodal__x svg{ width:17px; height:17px; }
.sm-field{ display:block; margin-bottom:14px; }
.sm-field > span{ display:block; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--tx-mid); margin-bottom:7px; }
.sm-field input, .sm-field textarea{ width:100%; box-sizing:border-box; font-family:"Inter",sans-serif; font-size:14px;
  color:var(--tx-hi); background:var(--bg-1); border:1px solid var(--line-2); border-radius:9px; padding:10px 12px; outline:none; }
.sm-field textarea{ resize:vertical; line-height:1.5; }
.sm-field input:focus, .sm-field textarea:focus{ border-color:var(--gold); }
.sm-two{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.sm-dlg{ margin-top:6px; padding:14px; border-radius:12px; background:rgba(124,58,237,0.07); border:1px solid rgba(157,107,255,0.28); }
.sm-dlg__h{ font-family:"Cinzel",serif; font-weight:600; font-size:13px; color:var(--violet-lit); margin-bottom:11px; }
.sm-dlg__hint{ font-family:"Inter",sans-serif; font-weight:400; font-size:11px; color:var(--tx-low); letter-spacing:0; text-transform:none; }
.shot__dlglist{ margin-top:12px; padding:11px 12px; border-radius:9px; background:rgba(124,58,237,0.07); border:1px solid rgba(157,107,255,0.24); display:flex; flex-direction:column; gap:7px; }
.shot__dlglist .shot__dlg{ margin-top:0; padding:7px 10px; }
.shot__dlglist .shot__dlg__tag{ align-self:flex-start; }
.shot__dlg--more{ align-self:flex-start; cursor:pointer; font-size:12px; color:var(--violet-lit); background:none; border:none; padding:2px 2px; }
.shot__dlg--more:hover{ text-decoration:underline; }
.sm-dlg__empty{ font-size:12.5px; color:var(--tx-mid); font-style:italic; margin-bottom:10px; }
.sm-dlgrow{ padding:11px; border-radius:9px; background:var(--bg-1); border:1px solid var(--line); margin-bottom:9px; }
.sm-dlgrow__head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:7px; }
.sm-dlgrow__n{ font-family:"Cinzel",serif; font-weight:600; font-size:12px; color:var(--violet-lit); }
.sm-dlgrow__del{ cursor:pointer; color:var(--tx-mid); background:none; border:none; }
.sm-dlgrow__del svg{ width:14px; height:14px; }
.sm-dlgrow__del:hover{ color:var(--st-draft); }
.sm-dlg__add{ cursor:pointer; font-size:13px; color:var(--violet-lit); background:rgba(124,58,237,0.1); border:1px dashed rgba(157,107,255,0.4); border-radius:8px; padding:9px; width:100%; transition:.16s; }
.sm-dlg__add:hover{ background:rgba(124,58,237,0.18); }
.sm-dlg__dur{ margin-top:8px; font-size:11.5px; color:var(--violet-lit); }
.sm-img{ position:relative; width:100%; aspect-ratio:16/9; border-radius:10px; background:var(--bg-1) center/cover no-repeat;
  border:1px dashed var(--line-2); display:grid; place-items:center; overflow:hidden; }
.sm-img__ph{ display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--tx-mid); font-size:12.5px; }
.sm-img__ph svg{ width:24px; height:24px; }
.sm-img__btn{ position:absolute; right:10px; bottom:10px; cursor:pointer; font-size:12px; color:#1a1206;
  padding:7px 13px; border-radius:8px; background:linear-gradient(180deg,var(--gold-bright),var(--gold-lit)); }
.sm-img__del{ position:absolute; left:10px; bottom:10px; cursor:pointer; font-size:12px; color:var(--tx);
  padding:7px 12px; border-radius:8px; background:rgba(10,8,12,0.6); border:1px solid var(--line-2); }
.sm-foot{ display:flex; justify-content:flex-end; gap:10px; margin-top:8px; }
.varstrip{ display:flex; gap:6px; margin-top:8px; }
.varthumb{ position:relative; flex:1; aspect-ratio:16/10; border-radius:7px; cursor:pointer;
  background:linear-gradient(135deg, rgba(217,119,6,0.14), rgba(124,58,237,0.12)); border:1px solid var(--line-2);
  display:grid; place-items:center; transition:.16s; }
.varthumb__n{ font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--tx-mid); }
.varthumb:hover{ border-color:var(--gold); }
.varthumb.is-sel{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold-soft), inset 0 0 0 1px rgba(246,207,126,0.3); }
.varthumb.is-sel .varthumb__n{ color:var(--gold-lit); }
.varthumb--add{ flex:0 0 38px; background:rgba(255,255,255,0.02); color:var(--tx-mid); }
.varthumb--add svg{ width:15px; height:15px; }
.varthumb--add:hover{ color:var(--gold-lit); }

@media (max-width:900px){
  .content{ padding:22px 16px 50px; }
  .shot__body{ grid-template-columns:1fr; }
  .char-grid,.scn-grid,.mem-grid,.loc-grid{ grid-template-columns:1fr; }
  .stat-row{ flex-wrap:wrap; }
  .topbar{ padding:0 16px; gap:12px; }
  .topbar__btn--ghost{ display:none; }
}
</style>

<body>
<div id="root"></div>

<script src="ww-embed.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

<!-- Firebase modules -->
<script src="firebase/firebase-init.js"></script>
<script src="firebase/firebase-auth.js"></script>
<script src="firebase/firebase-projects.js"></script>
