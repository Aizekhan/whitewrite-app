<html lang="uk">
<head>

<title>White Tree — місце, де народжуються всесвіти</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Philosopher loaded locally via @font-face -->
<style>
@font-face{font-family:'Philosopher';src:url('assets/fonts/Philosopher-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'Philosopher';src:url('assets/fonts/Philosopher-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
@font-face{font-family:'Philosopher';src:url('assets/fonts/Philosopher-Italic.ttf') format('truetype');font-weight:400;font-style:italic;font-display:swap;}
@font-face{font-family:'Philosopher';src:url('assets/fonts/Philosopher-BoldItalic.ttf') format('truetype');font-weight:700;font-style:italic;font-display:swap;}
:root{
  --ink:        #3a2c1d;
  --ink-soft:   #6a5740;
  --gold:       #c9a24b;
  --gold-lit:   #f0d398;
  --gold-deep:  #8c6a2e;
  --parch:      #ece0c4;
  --parch-hi:   #f4ebd4;
  --parch-lo:   #d9c9a3;
  --night:      #100b07;
  --leaf-w:     min(540px, 47vw);
  --leaf-h:     min(740px, 80vh);
  --turn-ms:    1050ms;
  /* Page geometry - single source of truth */
  --page-top:    18%;
  --page-bottom: 24%;
  --page-left:   20%;
  --page-right-l: 53%; /* left page right edge */
  --page-left-r:  52%; /* right page left edge */
  --page-right-r: 20%; /* right page right edge */
  --page-padding-bottom: 2cqw;
}
*{ box-sizing:border-box; }
:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
html,body{ margin:0; height:100%; background:var(--night); overflow:hidden; }
#root{ height:100%; }
body{ font-family:"Philosopher",Georgia,serif; color:var(--ink);
  -webkit-font-smoothing:antialiased; }

/* ---------- World / library atmosphere ---------- */
.world{ position:fixed; inset:0; display:grid; place-items:center;
  background:
    radial-gradient(120% 90% at 50% 42%, #241809 0%, #160f08 42%, #0b0805 78%, #070503 100%);
  perspective:2600px; }
.ambient{ position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(45% 38% at 50% 40%, rgba(232,184,96,0.20), rgba(232,184,96,0) 70%),
    radial-gradient(80% 60% at 50% 120%, rgba(120,80,30,0.18), rgba(0,0,0,0) 60%);
  mix-blend-mode:screen; animation:breathe 9s ease-in-out infinite; }
@keyframes breathe{ 0%,100%{opacity:.85} 50%{opacity:1} }
.vignette{ position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(70% 70% at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.6) 100%);
  z-index:40; }
.particles{ position:absolute; inset:0; width:100%; height:100%;
  pointer-events:none; z-index:6; }

/* ---------- The Keeper ---------- */
.keeper{ position:absolute; z-index:5; pointer-events:none; }
.keeper--cover{ right:max(3vw,30px); bottom:0; height:88vh; width:min(360px,30vw); }
.keeper--reading{ left:-2vw; bottom:0; height:74vh; width:min(280px,22vw);
  opacity:.5; filter:saturate(.8); }
.keeper__figure{ position:absolute; inset:0; }
.keeper__halo{ position:absolute; left:50%; top:8%; width:140%; height:120%;
  transform:translateX(-50%);
  background:radial-gradient(closest-side, rgba(240,210,140,0.28), rgba(240,210,140,0) 70%);
  filter:blur(20px); animation:breathe 7s ease-in-out infinite; }
.keeper__robe{ position:absolute; left:50%; bottom:0; width:62%; height:80%;
  transform:translateX(-50%);
  background:linear-gradient(to top, rgba(8,6,4,0.92), rgba(20,14,8,0.7) 60%, rgba(28,20,10,0.1));
  border-radius:46% 46% 0 0 / 30% 30% 0 0;
  filter:blur(7px); }
.keeper__hood{ position:absolute; left:50%; top:12%; width:26%; height:30%;
  transform:translateX(-50%);
  background:radial-gradient(closest-side at 50% 40%, rgba(10,7,4,0.95), rgba(14,10,6,0.4) 75%, transparent);
  border-radius:50% 50% 44% 44%; filter:blur(6px); }
.keeper__rim{ position:absolute; left:50%; top:10%; width:30%; height:74%;
  transform:translateX(-46%);
  background:linear-gradient(105deg, rgba(245,214,150,0.0) 40%, rgba(245,214,150,0.5) 52%, rgba(245,214,150,0) 60%);
  filter:blur(3px); mix-blend-mode:screen; animation:rim 8s ease-in-out infinite; }
@keyframes rim{ 0%,100%{opacity:.4} 50%{opacity:.85} }
.keeper__whisper{ position:absolute; right:88%; bottom:46%; width:min(280px,26vw);
  text-align:right; font-style:italic; font-size:clamp(15px,1.4vw,20px);
  color:rgba(240,214,150,0.86); text-shadow:0 1px 14px rgba(0,0,0,0.8);
  opacity:0; transform:translateY(8px); transition:opacity 1.6s ease, transform 1.6s ease;
  transition-delay:.6s; }
.keeper__whisper.is-shown{ opacity:1; transform:translateY(0); }

/* ---------- Stage + Book ---------- */
.stage{ position:relative; z-index:10; transform-style:preserve-3d; }
.book{ position:relative; width:calc(var(--leaf-w)*2); height:var(--leaf-h);
  transform-style:preserve-3d; transition:transform 1.2s cubic-bezier(.2,.7,.2,1); }
.book--closed{ transform:rotateX(6deg) scale(.96); }
.book--opening{ transform:rotateX(2deg) scale(1); }
.book--reading{ transform:rotateX(1deg); }
.book__spine{ position:absolute; left:50%; top:-1.4%; width:26px; height:103%;
  transform:translateX(-50%); z-index:3; pointer-events:none;
  background:linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(40,26,12,0.55) 38%,
     rgba(20,12,6,0.85) 50%, rgba(40,26,12,0.55) 62%, rgba(0,0,0,0) 100%);
  filter:blur(.3px); }

/* leaves (the visible base pages) */
.leaf{ position:absolute; top:0; width:var(--leaf-w); height:100%;
  background:var(--parch); overflow:hidden;
  box-shadow:0 30px 70px rgba(0,0,0,0.6); }
.leaf--left{ left:0; border-radius:5px 0 0 5px;
  background:
    radial-gradient(120% 100% at 100% 50%, rgba(150,120,70,0.16), rgba(150,120,70,0) 38%),
    linear-gradient(180deg, var(--parch-hi), var(--parch) 30%, var(--parch-lo)); }
.leaf--right{ right:0; border-radius:0 5px 5px 0;
  background:
    radial-gradient(120% 100% at 0% 50%, rgba(150,120,70,0.16), rgba(150,120,70,0) 38%),
    linear-gradient(180deg, var(--parch-hi), var(--parch) 30%, var(--parch-lo)); }
.leaf__paper{ position:absolute; inset:0;
  background-image:
    radial-gradient(70% 50% at 30% 18%, rgba(120,90,40,0.05), transparent 60%),
    radial-gradient(60% 40% at 80% 86%, rgba(120,90,40,0.06), transparent 60%); }
.leaf__gutter{ position:absolute; top:0; width:60px; height:100%; pointer-events:none; z-index:2; }
.leaf__gutter--left{ right:0; background:linear-gradient(90deg, transparent, rgba(60,40,18,0.22)); }
.leaf__gutter--right{ left:0; background:linear-gradient(270deg, transparent, rgba(60,40,18,0.22)); }

/* ---------- Page turning ---------- */
.flipper{ position:absolute; top:0; width:var(--leaf-w); height:100%;
  transform-style:preserve-3d; z-index:6; }
.flipper--next{ left:50%; transform-origin:left center; animation:flipNext var(--turn-ms) cubic-bezier(.46,.03,.52,.96) forwards; }
.flipper--prev{ left:0;   transform-origin:right center; animation:flipPrev var(--turn-ms) cubic-bezier(.46,.03,.52,.96) forwards; }
@keyframes flipNext{ from{transform:rotateY(0)} to{transform:rotateY(-180deg)} }
@keyframes flipPrev{ from{transform:rotateY(0)} to{transform:rotateY(180deg)} }
.flipper__face{ position:absolute; inset:0; backface-visibility:hidden;
  -webkit-backface-visibility:hidden; background:var(--parch); overflow:hidden;
  background-image:linear-gradient(180deg, var(--parch-hi), var(--parch) 30%, var(--parch-lo)); }
.flipper__front{ box-shadow:inset 0 0 60px rgba(70,46,18,0.08);
  animation:faceFront var(--turn-ms) cubic-bezier(.46,.03,.52,.96) forwards; }
.flipper__back{ transform:rotateY(180deg);
  animation:faceBack var(--turn-ms) cubic-bezier(.46,.03,.52,.96) forwards; }
@keyframes faceFront{ 0%,49.99%{opacity:1} 50%{opacity:0} 100%{opacity:0} }
@keyframes faceBack{ 0%,49.99%{opacity:0} 50%{opacity:1} 100%{opacity:1} }
.flipper--next .flipper__front{ border-radius:0 5px 5px 0; }
.flipper--prev .flipper__front{ border-radius:5px 0 0 5px; }
.flipper__shade{ position:absolute; inset:0; z-index:3; pointer-events:none;
  background:linear-gradient(90deg, rgba(0,0,0,0.32), rgba(0,0,0,0));
  opacity:0; animation:shade var(--turn-ms) cubic-bezier(.46,.03,.52,.96) forwards; }
.flipper--prev .flipper__shade{ background:linear-gradient(270deg, rgba(0,0,0,0.32), rgba(0,0,0,0)); }
@keyframes shade{ 0%{opacity:0} 50%{opacity:.55} 100%{opacity:0} }

/* ---------- Closed cover ---------- */
.cover{ position:absolute; inset:0; z-index:20; cursor:pointer;
  transform-origin:left center; backface-visibility:hidden;
  border-radius:6px 10px 10px 6px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  box-shadow:0 50px 90px rgba(0,0,0,0.7), inset 0 0 120px rgba(0,0,0,0.5); }
.cover__leather{ position:absolute; inset:0; border-radius:inherit; z-index:-1;
  background:
    radial-gradient(120% 120% at 30% 20%, #3a2912, #2a1d0c 50%, #1c1308 100%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,0.4); }
.cover__leather::after{ content:""; position:absolute; inset:0; border-radius:inherit;
  opacity:.5; mix-blend-mode:overlay;
  background-image:repeating-linear-gradient(64deg, rgba(255,220,150,0.05) 0 2px, transparent 2px 7px),
    repeating-linear-gradient(-24deg, rgba(0,0,0,0.07) 0 3px, transparent 3px 9px); }
.cover__frame{ position:absolute; inset:22px; border-radius:5px;
  border:1.5px solid rgba(201,162,75,0.55);
  box-shadow:inset 0 0 0 5px rgba(201,162,75,0.12), 0 0 30px rgba(201,162,75,0.12); }
.cover__emblem{ font-size:clamp(34px,5vw,58px); color:var(--gold-lit);
  text-shadow:0 0 26px rgba(240,210,140,0.6); margin-bottom:6px; }
.cover__kicker{ font-size:clamp(11px,1.1vw,14px); letter-spacing:.42em;
  text-transform:uppercase; color:rgba(201,162,75,0.8); margin-bottom:18px; }
.cover__title{ font-family:"Philosopher",serif; font-weight:700;
  font-size:clamp(34px,5.4vw,68px); line-height:1.04; text-align:center; margin:0;
  color:#e7c97e; text-shadow:0 1px 0 rgba(0,0,0,0.5), 0 0 34px rgba(201,162,75,0.35);
  background:linear-gradient(180deg,#f3d792,#bb8e3e); -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; padding:0 8%; }
.cover__rule{ width:120px; height:1px; margin:24px 0 16px;
  background:linear-gradient(90deg, transparent, var(--gold), transparent); }
.cover__hint{ font-style:italic; font-size:clamp(13px,1.3vw,17px);
  color:rgba(220,196,140,0.66); animation:pulse 3.4s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{opacity:.45} 50%{opacity:.9} }
.phase-opening .cover{ animation:openCover 1.5s cubic-bezier(.45,.05,.2,1) forwards; }
@keyframes openCover{
  0%{ transform:rotateY(0); }
  100%{ transform:rotateY(-162deg); box-shadow:0 50px 90px rgba(0,0,0,0); }
}
.phase-closed .leaf, .phase-opening .leaf{ filter:brightness(.7); }
.phase-reading .leaf{ transition:filter 1.2s ease; }

/* ---------- Page content ---------- */
.page-inner{ position:absolute; inset:0; padding:clamp(20px,3.4vh,48px) clamp(28px,3.7vw,56px);
  padding-top:clamp(32px,4.5vh,60px); /* Increased top padding to prevent text overflow */
  padding-bottom:clamp(32px,4.5vh,60px); /* Increased bottom padding to prevent text overflow */
  display:flex; flex-direction:column; z-index:1; }
.leaf--left .page-inner{ padding-right:clamp(40px,5vw,70px); }
.leaf--right .page-inner{ padding-left:clamp(40px,5vw,70px); }
.page-head{ margin-bottom:24px; } /* Increased spacing after scene title */
.page-head__kicker{ font-size:11px; letter-spacing:.36em; text-transform:uppercase;
  color:#8c5a1e; margin-bottom:8px; }
.page-head__title{ font-family:"Philosopher",serif; font-weight:600;
  font-size:clamp(22px,2.5vw,34px); margin:0; color:#46341f; line-height:1.1; }
.page-head__rule{ height:1px; margin-top:14px;
  background:linear-gradient(90deg, rgba(140,106,46,0.6), rgba(140,106,46,0)); }

.prose{ font-size:clamp(14px,1.34vw,18px); line-height:1.7; color:var(--ink);
  margin:0 0 11px; text-align:justify; text-wrap: pretty; hyphens:auto;
  text-indent:1.5em; /* Red line (indent) for paragraphs */
  orphans: 3; widows: 3; /* Prevent single lines at page breaks */
  font-feature-settings: "kern" 1, "liga" 1; /* Enable kerning and ligatures */
  text-rendering: optimizeLegibility;
  hanging-punctuation: first last; /* Hanging punctuation for quotes/dashes */
  word-wrap: break-word; /* Break long words */
  overflow-wrap: break-word; /* Modern spec */
  max-width: 100%; /* Prevent overflow */
}
.prose:has(.prose__cap){ text-indent:0; } /* No indent for first paragraph with drop cap */
.prose__cap{ float:left; font-family:"Philosopher",serif; font-weight:700;
  font-size:clamp(42px,5.2vw,72px); line-height:.72; padding:5px 11px 0 0;
  color:var(--gold-deep); }
.margin-note{ display:flex; gap:10px; align-items:flex-start; margin:6px 0 16px;
  padding-left:8px; font-style:italic; color:#7a5b2c;
  font-size:clamp(13px,1.25vw,16px); line-height:1.5; }
.margin-note__rune{ color:var(--gold); font-style:normal; transform:translateY(2px);
  font-size:1.05em; }
.margin-note__body{ border-left:0; }
.folio{ margin-top:auto; align-self:center; font-style:italic;
  font-size:13px; color:var(--ink-soft); letter-spacing:.1em; padding-top:14px; }

/* placeholders (striped, honest) */
.placeholder{ position:relative;
  background-color:#ddcca4;
  background-image:repeating-linear-gradient(45deg, rgba(120,90,40,0.13) 0 6px, transparent 6px 12px);
  border:1px solid rgba(120,90,40,0.3); display:grid; place-items:center; }
.placeholder__label{ font-family:"SFMono-Regular",ui-monospace,Menlo,monospace;
  font-size:11px; letter-spacing:.08em; color:#8a6c3c; text-transform:lowercase; }

/* title / threshold pages */
.page-title{ align-items:center; justify-content:center; text-align:center; }
.title-mark{ font-size:clamp(26px,3.5vw,40px); color:#9a6f25;
  text-shadow:0 1px 2px rgba(60,40,15,0.4); }
.title-kicker{ margin-top:18px; font-size:11px; letter-spacing:.4em;
  text-transform:uppercase; color:#6e521f; }
.title-name{ font-family:"Philosopher",serif; font-weight:700;
  font-size:clamp(34px,4.6vw,58px); margin:10px 0 6px; color:#46341f; line-height:1.04; }
.title-sub{ font-style:italic; color:var(--ink-soft); font-size:clamp(14px,1.3vw,18px); }
.title-orn{ margin:26px 0; color:#9a6f25; letter-spacing:.4em; }
.title-epigraph{ max-width:30ch; font-style:italic; line-height:1.66;
  font-size:clamp(15px,1.5vw,20px); color:#5b4527; margin:0; }

/* inline scene editor → canon proposal */
.se-hint{ font-size:12px; font-style:italic; color:#8a6c3c; margin:0 0 10px; }
.se-prose{ font-family:"Philosopher",serif; font-size:clamp(14px,1.34vw,17px); line-height:1.66;
  color:#3a2c1d; outline:none; padding:8px 10px; border-radius:3px;
  border:1px dashed rgba(140,106,46,0.0); transition:border-color .25s, background .25s; min-height:3em; }
.se-prose:hover{ border-color:rgba(140,106,46,0.0); }
.se-prose.is-editing{ border-color:rgba(154,111,37,0.45); cursor:text; }
.se-prose.is-editing:hover{ border-color:rgba(140,106,46,0.5); }
.se-prose:focus{ border-color:rgba(140,106,46,0.6); background:rgba(255,250,235,0.4); }
.se-edittoggle{ display:none !important; }
.scenebar__div{ width:1px; height:24px; background:rgba(201,162,75,0.3); }
.bookbar__edit{ width:38px; height:38px; border-radius:9px; cursor:pointer; font-size:17px; color:#e9cd92;
  background:rgba(20,14,7,0.6); border:1px solid rgba(201,162,75,0.4); transition:.18s; }
.bookbar__edit:hover{ color:#1c1308; background:linear-gradient(180deg,#e9c878,#bd9040); border-color:transparent; }
.bookbar__edit.is-on{ color:#1c1308; background:linear-gradient(180deg,#f6cf7e,#d99a32); border-color:transparent;
  box-shadow:0 0 0 2px rgba(246,207,126,0.35), 0 0 16px rgba(246,207,126,0.7); animation:editGlow 1.4s ease-in-out infinite; }
@keyframes editGlow{ 0%,100%{ box-shadow:0 0 0 2px rgba(246,207,126,0.3), 0 0 12px rgba(246,207,126,0.5); } 50%{ box-shadow:0 0 0 2px rgba(246,207,126,0.5), 0 0 22px rgba(246,207,126,0.9); } }
.se-edittoggle:hover{ filter:brightness(1.06); transform:translateY(-1px); }
.se-edittoggle.is-on{ color:#f6e3b5; background:linear-gradient(180deg, rgba(60,42,20,0.92), rgba(34,22,10,0.95)); border:1px solid rgba(201,162,75,0.5); }
.se-added{ display:flex; align-items:center; flex-wrap:wrap; gap:7px; margin-top:12px; }
.se-added__k{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#7a5b2c; }
.se-added__chip{ font-size:12.5px; color:#2a1c0a; padding:4px 10px; border-radius:20px;
  background:linear-gradient(180deg, rgba(233,200,120,0.6), rgba(201,162,75,0.4)); border:1px solid #9a6f25; }
.se-keeper{ margin-top:16px; padding:13px 14px; border-radius:5px;
  background:linear-gradient(180deg, rgba(244,236,214,0.96), rgba(230,217,184,0.96));
  border:1px solid rgba(140,106,46,0.5); box-shadow:0 14px 34px rgba(0,0,0,0.25);
  animation:seIn .3s ease both; }
@keyframes seIn{ from{ opacity:0; transform:translateY(6px) } to{ opacity:1; transform:none } }
.se-keeper__head{ display:flex; align-items:center; gap:8px; font-family:"Philosopher",serif; font-weight:700;
  color:#3a2614; font-size:15px; margin-bottom:10px; }
.se-keeper__sig{ color:#9a6f25; }
.se-prop{ padding:10px 0; border-top:1px solid rgba(140,106,46,0.25); }
.se-prop:first-of-type{ border-top:none; }
.se-prop__t{ font-size:14px; color:#3a2614; }
.se-prop__t b{ color:#7a3a18; }
.se-prop--warn .se-prop__t b{ color:#a4321f; }
.se-prop__d{ font-size:12.5px; color:#6a5740; font-style:italic; margin:4px 0 9px; }
.se-prop__acts{ display:flex; gap:7px; flex-wrap:wrap; }
.se-btn{ cursor:pointer; font-family:"Philosopher",serif; font-size:12.5px; color:#4a3415;
  padding:7px 12px; border-radius:3px; border:1px solid rgba(120,90,46,0.45); background:rgba(255,251,240,0.5);
  transition:.18s; }
.se-btn:hover{ border-color:#9a6f25; background:rgba(255,251,240,0.9); }
.se-btn--ok{ color:#2a1c0a; border-color:#9a6f25; background:linear-gradient(180deg, rgba(233,200,120,0.7), rgba(201,162,75,0.45)); }
.se-btn--warn{ color:#fff; border-color:#a4321f; background:linear-gradient(180deg,#c0492f,#9a2f1c); }
.se-prop__types{ display:flex; gap:6px; margin:0 0 9px; }
.se-type{ cursor:pointer; font-family:"Philosopher",serif; font-size:12px; color:#7a5b2c;
  padding:5px 11px; border-radius:20px; border:1px solid rgba(120,90,46,0.4); background:rgba(255,251,240,0.4); transition:.16s; }
.se-type:hover{ border-color:#9a6f25; }
.se-type.is-on{ color:#2a1c0a; border-color:#9a6f25; background:linear-gradient(180deg, rgba(233,200,120,0.6), rgba(201,162,75,0.4)); }
.se-hint__pen{ color:#9a6f25; }
.se-coach{ margin-top:14px; padding:14px 15px; border-radius:5px;
  background:linear-gradient(180deg, rgba(46,30,14,0.95), rgba(28,18,9,0.96));
  border:1px solid rgba(201,162,75,0.5); box-shadow:0 16px 40px rgba(0,0,0,0.4);
  animation:seIn .35s ease both; }
.se-coach__t{ font-family:"Philosopher",serif; font-weight:700; font-size:15px; color:#f3e4bb; margin-bottom:6px; }
.se-coach__d{ font-size:13px; line-height:1.55; color:#cdb98a; font-style:italic; }
.se-coach__btn{ margin-top:11px; cursor:pointer; font-family:"Philosopher",serif; font-size:13px; color:#1c1308;
  padding:8px 16px; border-radius:3px; border:none; background:linear-gradient(180deg,#e9c878,#bd9040);
  box-shadow:inset 0 1px 0 rgba(255,240,200,0.5); }

/* end-of-scene Scene Intent */
.page-intent-left{ }
.page-intent-right{
  display:flex;
  flex-direction:column;
  min-height:0; }

  color:#7a5b2c;
  font-style:italic;
  line-height:1.5; }

/* Seal position at bottom */
.crossroads__seal{
  margin-top:auto;
  padding-top:1.2cqw; }

.quill{ margin-top:30px; font-family:"Philosopher",serif; cursor:pointer;
  background:transparent; color:var(--gold-deep);
  border:1px solid rgba(140,106,46,0.5); border-radius:2px;
  padding:11px 22px; font-size:15px; letter-spacing:.04em;
  transition:all .4s ease; }
.quill:hover{ color:#3a2c1d; border-color:var(--gold);
  box-shadow:0 0 26px rgba(201,162,75,0.25); background:rgba(201,162,75,0.08); }

/* characters */
.char{ display:flex; gap:16px; align-items:flex-start; margin-bottom:20px; }
.char__portrait{ width:clamp(70px,8vw,94px); height:clamp(86px,10vw,116px);
  flex:0 0 auto; border-radius:2px; }
.char__name{ font-family:"Philosopher",serif; font-weight:600;
  font-size:clamp(17px,1.7vw,22px); color:#46341f; }
.char__role{ font-size:10.5px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--gold-deep); margin:2px 0 7px; }
.char__lines{ margin:0; font-size:clamp(13.5px,1.3vw,16px); line-height:1.55;
  color:var(--ink); }

/* map */
.page-map{ }
.map{ position:relative; flex:1; margin-top:6px; }
.map__plate{ position:absolute; inset:0; border-radius:3px; }
.map__pin{ position:absolute; transform:translate(-50%,-50%);
  display:flex; align-items:center; gap:7px; z-index:2; }
.map__dot{ width:7px; height:7px; border-radius:50%; background:var(--gold-deep);
  box-shadow:0 0 0 3px rgba(201,162,75,0.18); flex:0 0 auto; }
.map__name{ font-style:italic; font-size:clamp(11px,1.15vw,15px); color:#5b4527;
  white-space:nowrap; text-shadow:0 1px 0 rgba(244,235,212,0.8); }
.map__compass{ position:absolute; right:10px; top:10px; width:30px; height:30px;
  border:1px solid rgba(140,106,46,0.5); border-radius:50%; display:grid;
  place-items:center; font-size:12px; color:var(--gold-deep); font-style:italic; }

/* writing leaf */
.writing{ flex:1; margin-top:4px; outline:none; caret-color:var(--gold-deep);
  font-style:italic; font-size:clamp(16px,1.6vw,21px); line-height:1.9; color:var(--ink);
  background-image:repeating-linear-gradient(transparent 0 calc(1.9em - 1px),
     rgba(140,106,46,0.16) calc(1.9em - 1px) 1.9em);
  background-position:0 .55em;
  max-height: calc(1.9em * 20); /* Limit to 20 lines */
  overflow: hidden; }
.writing:empty:before{ content:attr(data-placeholder); color:rgba(120,96,56,0.55); }
.writing__caret-hint{ align-self:flex-end; font-size:11px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--gold-deep); opacity:.6; margin-top:6px; }

/* ---------- Minimal hidden navigation ---------- */
.ribbon{ position:fixed; top:0; left:0; right:0; z-index:50; pointer-events:none;
  display:flex; align-items:center; gap:12px; justify-content:center;
  padding:14px 20px; font-size:13px; letter-spacing:.04em;
  color:rgba(220,196,140,0.0); transition:color .5s ease, background .5s ease;
  background:linear-gradient(180deg, rgba(10,7,4,0.0), rgba(10,7,4,0)); }
.ribbon:hover{ color:rgba(220,196,140,0.85);
  background:linear-gradient(180deg, rgba(10,7,4,0.6), rgba(10,7,4,0)); }
.ribbon__brand{ font-family:"Philosopher",serif; letter-spacing:.16em; }
.ribbon__sep{ opacity:.5; }
.ribbon__universe{ font-style:italic; }
.ribbon__close{ margin-left:18px; background:transparent; cursor:pointer;
  border:1px solid rgba(201,162,75,0); color:inherit; border-radius:2px;
  padding:5px 12px; font-family:"Philosopher",serif; font-size:12px;
  transition:border-color .5s ease, color .3s ease; }
.ribbon:hover .ribbon__close{ border-color:rgba(201,162,75,0.4); }
.ribbon__close:hover{ border-color:var(--gold)!important; color:var(--gold-lit); }

.turn{ position:absolute; top:50%; transform:translateY(-50%); z-index:30;

  background:transparent; border:none; color:rgba(240,214,150,0.0);

  text-shadow:0 0 18px rgba(0,0,0,0.8); }
.turn--prev{ left:-66px; }
.turn--next{ right:-66px; }
.book:hover .turn{ color:rgba(240,214,150,0.5); }

.peel{ position:absolute; right:0; bottom:0; width:70px; height:70px; z-index:25;
  cursor:pointer; border-radius:0 0 5px 0;
  background:linear-gradient(135deg, transparent 50%, rgba(60,40,18,0.18) 50%, rgba(120,90,40,0.32));
  transition:width .35s ease, height .35s ease, filter .35s ease; }
.peel:hover{ width:104px; height:104px; filter:drop-shadow(-6px -6px 10px rgba(0,0,0,0.35)); }

.pager{ display:flex; gap:7px; align-items:center; }
.pager__dot{ min-width:24px; height:24px; padding:0 6px; border-radius:12px; cursor:pointer;

.pager__dot.is-on{ color:#1c1308; background:linear-gradient(180deg,#e9c878,#bd9040); border-color:transparent;

/* bottom book bar: scene picker + numbered pages + nav */
.bookbar{ position:fixed; bottom:max(2.4vh,16px); left:50%; transform:translateX(-50%); z-index:50;
  display:flex; align-items:center; gap:10px; padding:7px 9px; border-radius:14px;
  background:rgba(20,13,6,0.72); border:1px solid rgba(201,162,75,0.34); box-shadow:0 12px 34px rgba(0,0,0,0.5); }

/* ---------- Keeper narrator rail ---------- */
.whisper-rail{ position:fixed; left:max(3vw,26px); bottom:max(12vh,96px); z-index:50;
  max-width:min(340px,30vw); display:flex; flex-direction:column; gap:8px;

  pointer-events:none; }
.whisper-rail.is-shown{ opacity:1; transform:translateX(0); }
.whisper-rail__mark{ width:34px; height:1px; background:linear-gradient(90deg,var(--gold),transparent); }
.whisper-rail__text{ margin:0; font-style:italic; line-height:1.5;

  text-shadow:0 1px 16px rgba(0,0,0,0.85); }
.whisper-rail__who{ font-size:10.5px; letter-spacing:.34em; text-transform:uppercase;
  color:rgba(201,162,75,0.65); }

/* ===========================================================
   FLOW STAGES  (Stage 0 start · Stage 1 form · Stage 2 ritual)
   =========================================================== */
.app{ position:fixed; inset:0; }
.stage-screen{ position:fixed; inset:0; animation:stageIn .9s ease both; }
@keyframes stageIn{ from{ opacity:0 } to{ opacity:1 } }

.screen{ position:fixed; inset:0; overflow:hidden;

}

/* --- Stage 1: parchment form --- */
.screen--form{ overflow-y:auto; align-content:safe center; padding:28px 0;

.form-parch{ position:relative; z-index:12;

  box-shadow:0 30px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,235,180,0.06);

.form-inner{ padding:clamp(46px,6vw,72px) clamp(48px,7vw,86px); color:#e8d9b8; }

/* genre / tone chips */

.field__area{ width:100%; box-sizing:border-box; resize:vertical;  font-family:"Philosopher",serif; font-size:clamp(15px,1.5vw,17px); line-height:1.55; color:#f0e6cd;
  background:rgba(20,14,9,0.55); border:1px solid rgba(201,162,75,0.35); border-radius:3px;
  padding:12px 14px; outline:none; transition:border-color .3s, box-shadow .3s; }
.field__area::placeholder{ color:rgba(200,176,120,0.5); font-style:italic; }
.field__input{ width:100%; box-sizing:border-box; font-family:"Philosopher",serif;
  font-size:clamp(15px,1.5vw,18px); color:#f0e6cd; background:rgba(20,14,9,0.55);
  border:1px solid rgba(201,162,75,0.35); border-radius:3px; padding:11px 14px; outline:none;
  transition:border-color .3s, box-shadow .3s; }
.field__input::placeholder{ color:rgba(200,176,120,0.5); font-style:italic; }
.field__input:focus{ border-color:var(--gold-lit); box-shadow:0 0 0 3px rgba(201,162,75,0.18); }
.field__note{ display:block; margin-top:8px; font-style:italic; font-size:12.5px; color:rgba(194,161,87,0.78); }
.field__area:focus{ border-color:var(--gold-lit); box-shadow:0 0 0 3px rgba(201,162,75,0.18); }

.seg{ display:flex; gap:8px; flex-wrap:wrap; }
.seg__opt{ flex:1 1 0; min-width:fit-content; cursor:pointer;
  font-family:"Philosopher",serif; font-size:14px; color:#c2a673;
  display:flex; align-items:center; justify-content:center; gap:7px;
  padding:10px 12px; border:1px solid rgba(201,162,75,0.32); border-radius:3px;
  background:rgba(40,28,14,0.42); transition:all .25s ease; white-space:nowrap; }
.seg__opt:hover{ border-color:rgba(201,162,75,0.65); color:#f0d398; }
.seg__opt.is-on{ color:#1c1308; border-color:#e6be6c;
  background:linear-gradient(180deg, rgba(233,200,120,0.92), rgba(201,162,75,0.78));
  box-shadow:inset 0 1px 0 rgba(255,245,210,0.5), 0 0 0 3px rgba(201,162,75,0.4);
  font-weight:700;
  transform:scale(1.05); }
.seg__icon{ color:#e6be6c; }

.wslider input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:4px;
  border-radius:3px; outline:none; cursor:pointer;
  background:linear-gradient(90deg, var(--gold-deep) var(--fill,40%), rgba(120,90,46,0.3) var(--fill,40%)); }
.wslider input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none;
  width:18px; height:18px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #f4d999, #bd9040);
  border:1px solid rgba(90,64,20,0.6); box-shadow:0 2px 8px rgba(0,0,0,0.35); }
.wslider input[type=range]::-moz-range-thumb{ width:18px; height:18px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #f4d999, #bd9040); border:1px solid rgba(90,64,20,0.6); }
.wslider__row{ display:flex; justify-content:space-between; margin-top:9px;
  font-size:12px; color:#b7975a; }
.wslider__val{ font-style:italic; color:#f0d398; }

.form-foot{ display:flex; align-items:center; justify-content:space-between;
  margin-top:28px; gap:14px; }
.link-back{ background:transparent; border:none; cursor:pointer; color:#b7975a;
  font-family:"Philosopher",serif; font-size:15px; transition:color .3s; }
.link-back:hover{ color:#f0d398; }
.create-btn{ cursor:pointer; font-family:"Philosopher",serif; font-size:16px; letter-spacing:.02em;
  color:#1c1308; border:none; border-radius:3px; padding:13px 26px;
  background:linear-gradient(180deg,#e9c878,#bd9040);
  box-shadow:0 10px 28px rgba(120,84,24,0.36), inset 0 1px 0 rgba(255,240,200,0.6);
  transition:transform .3s, box-shadow .4s, opacity .3s; }
.create-btn:hover{ transform:translateY(-2px); box-shadow:0 16px 40px rgba(180,130,40,0.45), inset 0 1px 0 rgba(255,240,200,0.6); }
.create-btn.is-disabled{ opacity:.4; cursor:not-allowed; transform:none;
  box-shadow:none; filter:grayscale(.3); }

/* Token preview (Auto Mode) */
.token-preview{ margin-top:18px; padding:14px 16px; border-radius:3px;
  background:rgba(40,28,14,0.35); border:1px solid rgba(201,162,75,0.28);
  display:flex; flex-direction:column; gap:6px; }
.token-preview__label{ font-size:13px; color:rgba(194,161,87,0.85); font-style:italic; }
.token-preview__cost{ font-size:18px; font-weight:700; color:#f0d398;
  text-shadow:0 0 8px rgba(240,211,152,0.3); }
.token-preview__note{ font-size:12px; color:rgba(194,161,87,0.7); font-style:italic; }

/* --- Stage 2: generation ritual over the user's opening-book video --- */
.ritual{ position:fixed; inset:0; z-index:60; background:#0a0705;
  animation:stageIn .6s ease both; }
.ritual__video{ position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; }
.ritual__veil{ position:absolute; inset:0;
  background:radial-gradient(60% 50% at 50% 46%, rgba(10,7,4,0.28), rgba(8,5,3,0.6) 78%); }
.ritual__center{ position:absolute; inset:0; display:grid; place-content:center;
  justify-items:center; text-align:center; gap:6px; transition:opacity .8s ease; }
.ritual__center.is-closing{ opacity:0; }
.ritual__fade{ position:absolute; inset:0; background:#080503; opacity:0; pointer-events:none;
  transition:opacity .9s ease; }
.ritual__fade.is-on{ opacity:1; }
.ritual__glow{ position:absolute; width:520px; height:520px; border-radius:50%;
  background:radial-gradient(closest-side, rgba(240,210,140,0.22), transparent 70%);
  filter:blur(8px); animation:breathe 3.2s ease-in-out infinite; }
.ritual__mark{ position:relative; font-size:46px; color:var(--gold-lit);
  text-shadow:0 0 30px rgba(240,210,140,0.7); animation:spinMark 8s linear infinite; }
@keyframes spinMark{ from{ transform:rotate(0) } to{ transform:rotate(360deg) } }
.ritual__text{ position:relative; font-family:"Philosopher",serif;
  font-size:clamp(22px,2.6vw,32px); color:#eed492; margin-top:14px;
  text-shadow:0 1px 20px rgba(0,0,0,0.9); }
.ritual__premise{ position:relative; max-width:30ch; font-style:italic;
  color:rgba(230,206,150,0.82); font-size:clamp(14px,1.5vw,18px); margin-top:6px;
  text-shadow:0 1px 14px rgba(0,0,0,0.9); }
.ritual__dots{ position:relative; display:flex; gap:8px; margin-top:18px; }
.ritual__dots span{ width:7px; height:7px; border-radius:50%; background:var(--gold);
  animation:dot 1.4s ease-in-out infinite; }
.ritual__dots span:nth-child(2){ animation-delay:.2s; }
.ritual__dots span:nth-child(3){ animation-delay:.4s; }
@keyframes dot{ 0%,100%{ opacity:.25; transform:translateY(0) } 50%{ opacity:1; transform:translateY(-5px) } }

/* --- Stage 3: the photographed open book, FULL-BLEED, text over its pages --- */
.world.reading{ background:#0a0705; }
.photobook{ position:fixed; inset:0; z-index:10; width:100%; height:100%;
  animation:bookRise 1.5s cubic-bezier(.2,.7,.2,1) both; }
@keyframes bookReveal{ from{ opacity:0; filter:blur(22px); transform:scale(1.06); } to{ opacity:1; filter:blur(0); transform:scale(1); } }
.world.reading .photobook{ animation:none; }
.world.reading .photobook.is-revealing{ animation:bookReveal 1.5s ease both; }
@keyframes bookRise{ from{ opacity:0 } to{ opacity:1 } }
.photobook__img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  object-position:center; pointer-events:none; user-select:none; }
/* overlay box sized (via JS) to the cover-rendered image, centered */
.photobook__pages{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  container-type:inline-size; pointer-events:none; }
.photobook__pages .opage{ pointer-events:auto; }
.opage{ position:absolute; overflow:hidden; z-index:2; color:#42301b; }
.opage--left{ left:var(--page-left); right:var(--page-right-l); top:var(--page-top); bottom:var(--page-bottom); }
.opage--right{ left:var(--page-left-r); right:var(--page-right-r); top:var(--page-top); bottom:var(--page-bottom); }
.opage__fade{ position:absolute; inset:0; animation:inkIn 1s ease both; }
@keyframes inkIn{ from{ opacity:0; filter:blur(2px) } to{ opacity:1; filter:none } }

/* page content rescaled to the book via container-query units (cqw) */
.opage .page-inner,
.opage__fade .page-inner{ position:absolute; top:0; left:0; right:0; bottom:var(--page-padding-bottom); padding:0; display:flex; flex-direction:column; overflow:hidden; }
.opage .se-prose{ flex:1; min-height:0; overflow:hidden; padding-top:.4cqw; }
.opage .se-prose.is-editing{ overflow-y:auto; }
.se-pages{ display:flex; align-items:center; justify-content:center; gap:12px; margin-top:auto; padding-top:.6cqw; }
.se-pages__b{ cursor:pointer; font-family:"Philosopher",serif; font-size:1.4cqw; color:#9a6f25; background:none; border:none; }
.se-pages__b:disabled{ opacity:.3; cursor:default; }
.se-pages__n{ font-family:"Philosopher",serif; font-size:1.05cqw; color:#7a5b2c; font-style:italic; }
.opage .page-head{ margin-bottom:.7cqw; text-align:center; }
.opage .page-head__kicker{ font-size:1.0cqw; letter-spacing:.28em; margin-bottom:.5cqw; color:#9a5e1c; font-weight:600; }
.opage .page-head__title{ font-size:2.3cqw; line-height:1.08; }
.opage .page-head__rule{ margin-top:.8cqw; }
.opage .prose{ font-size:calc(1.3cqw * var(--book-size, 1)); line-height:1.5; margin:0 0 .6cqw;
  font-family:var(--book-font, "Philosopher"), serif; text-indent:1.5em;
  orphans: 3; widows: 3;
  font-feature-settings: "kern" 1, "liga" 1;
  text-rendering: optimizeLegibility;
  hanging-punctuation: first last;
  word-wrap: break-word;
  overflow-wrap: break-word;
  max-width: 100%;
}
.opage .prose:has(.prose__cap){ text-indent:0; } /* No indent for first paragraph */
.opage .prose__cap{ font-size:4.8cqw; padding:.3cqw .6cqw 0 0; }
.opage .margin-note{ font-size:1.32cqw; gap:.6cqw; margin:.2cqw 0 .7cqw; }
.opage .margin-note__rune{ font-size:1.4cqw; }
.opage .folio{ font-size:1.1cqw; padding-top:.4cqw; }

.opage .title-mark{ font-size:3cqw; }
.opage .title-kicker{ font-size:1cqw; margin-top:1.2cqw; }
.opage .title-name{ font-size:3.45cqw; margin:.6cqw 0 .4cqw; }
.opage .title-sub{ font-size:1.5cqw; }
.opage .title-orn{ margin:1.6cqw 0; }
.opage .title-epigraph{ font-size:1.6cqw; line-height:1.5; max-width:26ch; }
.opage .quill{ margin-top:2cqw; font-size:1.4cqw; padding:.8cqw 1.6cqw; }

.opage .char{ gap:1.2cqw; margin-bottom:1cqw; }
.opage .char__portrait{ width:7.4cqw; height:9.6cqw; }
.opage .char__name{ font-size:1.8cqw; }
.opage .char__role{ font-size:.92cqw; margin:.15cqw 0 .4cqw; }
.opage .char__lines{ font-size:1.26cqw; line-height:1.4; }
.opage .placeholder__label{ font-size:.9cqw; }

.opage .map{ margin-top:.5cqw; }
.opage .map__name{ font-size:1.15cqw; }
.opage .map__compass{ width:2.4cqw; height:2.4cqw; font-size:1cqw; }

.opage .writing{ font-size:1.7cqw; line-height:1.9;
  background-image:repeating-linear-gradient(transparent 0 calc(1.9em - 1px),
     rgba(120,90,46,0.22) calc(1.9em - 1px) 1.9em); }
.opage .writing__caret-hint{ font-size:.9cqw; }

.pturn{ position:fixed; bottom:14%; z-index:36;
  width:52px; height:52px; display:grid; place-items:center; cursor:pointer;
  background:rgba(30,19,9,0.6); border:1px solid rgba(201,162,75,0.5); border-radius:50%;
  color:rgba(245,222,160,0.9); backdrop-filter:blur(4px);
  box-shadow:0 6px 18px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,240,200,0.18), 0 0 14px rgba(201,162,75,0.18);
  font-size:30px; font-family:"Philosopher",serif; line-height:1; transition:color .25s, border-color .25s, background .25s, transform .25s; }
.pturn--prev{ left:20%; }
.pturn--next{ right:19.5%; }
.pturn:hover{ color:#fff !important; border-color:rgba(240,200,120,0.9);
  background:rgba(50,33,15,0.85); transform:scale(1.08); }
.pturn.is-disabled{ opacity:.28; cursor:default; }
.pturn.is-disabled:hover{ transform:none; color:rgba(245,222,160,0.9) !important; border-color:rgba(201,162,75,0.5); background:rgba(30,19,9,0.6); }

/* Reading → production workspace bridge (same universe) */
.to-workspace{ position:fixed; right:max(2.4vw,22px); bottom:max(4vh,26px); z-index:40;
  display:flex; align-items:center; gap:11px; cursor:pointer;
  font-family:"Philosopher",serif; font-size:clamp(14px,1.3vw,16px); letter-spacing:.02em;
  color:#f0d398; padding:12px 20px; border-radius:3px;
  background:linear-gradient(180deg, rgba(40,26,12,0.78), rgba(20,12,6,0.82));
  border:1px solid rgba(201,162,75,0.45);
  box-shadow:0 12px 34px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,240,200,0.12);
  backdrop-filter:blur(6px); transition:transform .3s ease, box-shadow .4s ease, border-color .3s; }
.to-workspace:hover{ transform:translateY(-2px); border-color:var(--gold);
  box-shadow:0 16px 42px rgba(0,0,0,0.55), 0 0 30px rgba(201,162,75,0.28), inset 0 1px 0 rgba(255,240,200,0.18); }
.to-workspace__arr{ font-size:1.15em; transition:transform .3s ease; }
.to-workspace:hover .to-workspace__arr{ transform:translateX(4px); }

/* "Пов'язане" — manuscript bookmarks peeking from the book's edge */
.bookmarks{ position:fixed; right:0; top:50%; transform:translateY(-50%); z-index:38;
  display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
.bm{ position:relative; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px;
  width:52px; padding:12px 0 10px; border-radius:8px 0 0 8px; color:#f0d9a8;
  background:
    linear-gradient(180deg, rgba(78,52,25,0.97), rgba(40,25,11,0.98)),
    repeating-linear-gradient(135deg, rgba(255,222,150,0.045) 0 2px, transparent 2px 6px);
  border:1px solid rgba(201,162,75,0.5); border-right:none;
  box-shadow:
    -8px 7px 22px rgba(0,0,0,0.5),
    inset 0 0 0 1px rgba(18,11,3,0.7),
    inset 0 0 0 2.5px rgba(201,162,75,0.34),
    inset 1px 1px 0 rgba(255,240,200,0.12);
  transition:transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s, background .35s; }
/* gemstone inset — colour tracks the category (--c) */
.bm::after{ content:""; position:absolute; top:7px; right:8px; width:7px; height:7px; border-radius:50%;
  background:radial-gradient(circle at 34% 28%, #fff, var(--c,#c9a24b) 78%);
  box-shadow:0 0 8px var(--c,rgba(201,162,75,0.7)), inset 0 0 0 1px rgba(255,255,255,0.45),
    0 1px 1px rgba(0,0,0,0.6); }
.bm:hover, .bm.is-active{ transform:translateX(-8px);
  background:
    linear-gradient(180deg, rgba(100,68,32,0.98), rgba(54,34,15,0.98)),
    repeating-linear-gradient(135deg, rgba(255,222,150,0.06) 0 2px, transparent 2px 6px);
  box-shadow:
    -13px 9px 28px rgba(0,0,0,0.58), 0 0 22px rgba(201,162,75,0.22),
    inset 0 0 0 1px rgba(18,11,3,0.7),
    inset 0 0 0 2.5px rgba(228,190,108,0.5),
    inset 1px 1px 0 rgba(255,240,200,0.16); }
.bm__glyph{ width:22px; height:22px; display:grid; place-items:center; color:#f3d489; font-size:16px;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,0.6)) drop-shadow(0 -1px 0 rgba(255,230,170,0.18)); }
.bm__glyph svg{ width:19px; height:19px; }
.bm__n{ font-family:"Philosopher",serif; font-size:12px; color:#e7c97e; line-height:1;
  text-shadow:0 1px 0 rgba(0,0,0,0.55); }
.bm--explore{ margin-top:6px; width:46px; padding:12px 0;
  background:
    linear-gradient(180deg, rgba(120,86,150,0.5), rgba(70,46,96,0.6)),
    repeating-linear-gradient(135deg, rgba(200,170,255,0.05) 0 2px, transparent 2px 6px);
  border-color:rgba(176,140,220,0.6); }
.bm--explore::after{ background:radial-gradient(circle at 34% 28%, #fff, #9d6bff 78%);
  box-shadow:0 0 9px rgba(157,107,255,0.8), inset 0 0 0 1px rgba(255,255,255,0.5), 0 1px 1px rgba(0,0,0,0.6); }
.bm--explore .bm__glyph{ color:#e8d6ff; font-size:18px; }
.bm--explore:hover{ transform:translateX(-8px);
  background:
    linear-gradient(180deg, rgba(140,102,176,0.62), rgba(86,58,118,0.7)),
    repeating-linear-gradient(135deg, rgba(200,170,255,0.07) 0 2px, transparent 2px 6px); }

.bm-scrim{ position:fixed; inset:0; z-index:38; }
.bm-pop{ position:fixed; right:60px; top:50%; transform:translateY(-50%); z-index:39;
  width:min(266px,74vw); max-height:70vh; overflow-y:auto; padding:16px 16px 13px; border-radius:5px;
  background:linear-gradient(180deg, rgba(244,236,214,0.98), rgba(230,217,184,0.98));
  border:1px solid rgba(140,106,46,0.55);
  box-shadow:0 26px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,250,235,0.6);
  animation:bmIn .36s ease both; }
@keyframes bmIn{ from{ opacity:0 } to{ opacity:1 } }
.bm-pop__head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:12px;
  padding-bottom:10px; border-bottom:1px solid rgba(140,106,46,0.3); }
.bm-pop__sub{ font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold-deep); }
.bm-pop__title{ font-family:"Philosopher",serif; font-weight:700; font-size:18px; color:#3a2614; margin-top:4px;
  display:flex; align-items:center; gap:8px; }
.bm-pop__title::before{ content:""; width:9px; height:9px; border-radius:50%; background:var(--c,var(--gold-deep)); }
.bm-pop__x{ cursor:pointer; width:26px; height:26px; flex:0 0 auto; border-radius:3px; color:#7a5b2c;
  border:1px solid rgba(140,106,46,0.4); background:transparent; font-size:12px; transition:.2s; }
.bm-pop__x:hover{ color:#3a2614; border-color:var(--gold-deep); background:rgba(201,162,75,0.12); }
.bm-pop__list{ display:flex; flex-direction:column; gap:5px; }
.bm-item{ display:flex; align-items:center; gap:9px; cursor:pointer; text-align:left; width:100%;
  font-family:"Philosopher",serif; font-size:14px; color:#3a2c1d; padding:8px 11px; border-radius:3px;
  background:rgba(255,251,240,0.5); border:1px solid rgba(120,90,46,0.35); transition:.2s; }
.bm-item:hover{ border-color:var(--c,var(--gold-deep)); background:rgba(255,251,240,0.96); transform:translateX(-2px); }
.bm-item__dot{ width:7px; height:7px; border-radius:50%; background:var(--c,var(--gold-deep)); flex:0 0 auto; }
.bm-item__t{ flex:1; min-width:0; }
.bm-item__go{ color:var(--gold-deep); font-size:17px; opacity:0; transition:.2s; }
.bm-item:hover .bm-item__go{ opacity:1; }
.bm-pop__foot{ margin-top:11px; padding-top:10px; border-top:1px solid rgba(140,106,46,0.3);
  font-size:11px; font-style:italic; color:#8a6c3c; text-align:center; }
.bm--explore .bm__glyph{ font-family:"Philosopher",serif; font-weight:700; font-size:16px; }
.ts-group{ margin-bottom:13px; }
.ts-lbl{ font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--gold-deep); margin-bottom:8px; }
.ts-row{ display:flex; gap:6px; }
.ts-btn{ flex:1; cursor:pointer; font-size:13px; color:#3a2c1d; padding:9px 6px; border-radius:3px;
  background:rgba(255,251,240,0.6); border:1px solid rgba(120,90,46,0.4); transition:.16s; }
.ts-btn:hover{ border-color:var(--gold-deep); background:rgba(255,251,240,0.95); }

/* --- ribbon actions (reading) --- */
.ribbon__actions{ margin-left:18px; display:flex; gap:10px; opacity:0; transition:opacity .5s ease; }
.ribbon:hover .ribbon__actions{ opacity:1; }
.ribbon__btn{ background:transparent; cursor:pointer; color:inherit; border-radius:2px;
  border:1px solid rgba(201,162,75,0.4); padding:5px 12px;
  font-family:"Philosopher",serif; font-size:12px; transition:border-color .3s, color .3s; }
.ribbon__btn:hover{ border-color:var(--gold); color:var(--gold-lit); }
.ribbon__btn--ghost{ border-color:rgba(201,162,75,0.22); }

/* unified pillar switcher — parchment/gold tone */
.pillswitch{ display:inline-flex; gap:3px; padding:4px; border-radius:4px;
  background:rgba(20,14,7,0.5); border:1px solid rgba(201,162,75,0.28); }
.pillswitch__b{ display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:3px;
  font-family:"Philosopher",serif; font-size:13px; color:rgba(220,196,140,0.7);
  border:1px solid transparent; transition:.22s ease; cursor:pointer; background:transparent; }
.pillswitch__b svg{ width:15px; height:15px; }
.pillswitch__b:hover{ color:var(--gold-lit); background:rgba(201,162,75,0.1); }
.pillswitch__b.is-here{ color:#2a1c0a; cursor:default;
  background:linear-gradient(180deg, rgba(233,200,120,0.92), rgba(201,162,75,0.82));
  box-shadow:inset 0 1px 0 rgba(255,245,210,0.6); }
.pillswitch__b.is-here:hover{ background:linear-gradient(180deg, rgba(233,200,120,0.92), rgba(201,162,75,0.82)); }

/* scene/act indicator + picker (reading view, top-left) */
.scenebar__menu--up{ top:auto; bottom:calc(100% + 7px); z-index:60; }
.scenebar__scrim{ position:fixed; inset:0; z-index:55; }
.scenebar{ position:fixed; top:max(2vh,16px); left:max(2vw,18px); z-index:40; display:flex; align-items:center; gap:8px; }
.scenebar__nav{ width:34px; height:34px; border-radius:50%; cursor:pointer; font-family:"Philosopher",serif; font-size:17px;
  color:#e9cd92; background:rgba(20,14,7,0.6); border:1px solid rgba(201,162,75,0.38); transition:.18s; }
.scenebar__nav:hover:not(:disabled){ color:var(--gold-lit); border-color:var(--gold); background:rgba(40,26,12,0.7); }
.scenebar__nav:disabled{ opacity:.32; cursor:default; }
.scenebar__pick{ position:relative; }
.scenebar__btn{ position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:1px; cursor:pointer; text-align:left;
  padding:6px 30px 6px 14px; border-radius:8px; background:rgba(20,14,7,0.6); border:1px solid rgba(201,162,75,0.38); transition:.18s; }
.scenebar__btn:hover, .scenebar__btn.is-open{ border-color:var(--gold); background:rgba(40,26,12,0.7); }
.scenebar__act{ font-family:"Cinzel",serif; font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:rgba(230,206,150,0.7); }
.scenebar__sc{ font-family:"Philosopher",serif; font-size:13.5px; color:#f0d9a8; }
.scenebar__caret{ position:absolute; right:11px; top:50%; transform:translateY(-50%); color:rgba(230,206,150,0.6); font-size:10px; }
.scenebar__menu{ position:absolute; top:calc(100% + 7px); left:0; min-width:260px; z-index:5; padding:6px;
  border-radius:10px; background:linear-gradient(180deg, rgba(44,30,15,0.98), rgba(26,17,9,0.99));
  border:1px solid rgba(201,162,75,0.4); box-shadow:0 18px 44px rgba(0,0,0,0.5); }
.scenebar__menu.scenebar__menu--up{ top:auto; bottom:calc(100% + 7px); z-index:60; max-height:62vh; overflow-y:auto; }
.scenebar__opt{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; cursor:pointer;
  padding:9px 11px; border-radius:7px; background:none; border:none; transition:.15s; }
.scenebar__opt:hover{ background:rgba(201,162,75,0.12); }
.scenebar__opt.is-on{ background:rgba(201,162,75,0.2); }
.scenebar__opt-act{ font-family:"Cinzel",serif; font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:rgba(230,206,150,0.65); flex:0 0 auto; }
.scenebar__opt-n{ display:grid; place-items:center; width:22px; height:22px; border-radius:6px; flex:0 0 auto;
  font-family:"JetBrains Mono",monospace; font-size:12px; color:#f0d9a8; background:rgba(201,162,75,0.18); border:1px solid rgba(201,162,75,0.35); }
.scenebar__opt-t{ font-family:"Philosopher",serif; font-size:13.5px; color:#e8dcc2; }

/* always-visible pillar navigation in the reading view (top-right, like the Tree) */
.book-nav{ position:fixed; top:max(2vh,16px); right:max(2vw,18px); z-index:60;
  display:flex; align-items:center; gap:8px; }
.book-nav__close{ width:34px; height:34px; display:grid; place-items:center; cursor:pointer;
  font-family:"Philosopher",serif; font-size:15px; color:rgba(220,196,140,0.8); border-radius:4px;
  background:rgba(20,14,7,0.5); border:1px solid rgba(201,162,75,0.28); transition:.22s ease; }
.book-nav__close:hover{ color:var(--gold-lit); border-color:var(--gold); background:rgba(201,162,75,0.12); }

@media (max-width:820px){
  .keeper__whisper{ display:none; }
  /* manuscript bookmarks: smaller on phones, popover near full-width */
  .bm{ width:40px; padding:7px 0 6px; }
  .bm__glyph{ width:17px; height:17px; }
  .bm__glyph svg{ width:16px; height:16px; }
  .bm-pop{ right:50px; left:12px; width:auto; max-height:60vh; }
  .hero-cta{ bottom:auto; }
  .world.reading{ display:block; overflow-y:auto; padding:26px 0; }
  .form-parch{ width:94vw; background-size:100% 100%; }
  .form-inner{ padding:40px 34px; }
  .seg{ flex-direction:column; }
  .seg__opt{ flex:none; }
  .ritual__glow{ width:80vw; height:80vw; }

  /* Reading on a phone: drop the wide two-page photo for a readable
     single parchment sheet that stacks the spread top-to-bottom. */
  .photobook{ position:relative; inset:auto; width:94vw; height:auto; aspect-ratio:auto;
    min-height:auto; margin:0 auto;
    background:url('assets/pergament.png') center/100% 100% no-repeat;
    padding:13vw 10vw; filter:drop-shadow(0 30px 60px rgba(0,0,0,0.6)); }
  .photobook__img{ display:none; }
  .photobook__pages{ position:static; transform:none;
    width:auto !important; height:auto !important; container-type:normal; }
  .opage{ position:static; overflow:visible; width:100%; }
  .opage--left{ margin-bottom:9vw; padding-bottom:9vw;
    border-bottom:1px solid rgba(140,106,46,0.4); }
  .opage__fade{ position:static; }
  .opage .page-inner{ position:static; }
  .opage .page-head__kicker{ font-size:11px; letter-spacing:.26em; margin-bottom:6px; }
  .opage .page-head__title{ font-size:23px; }
  .opage .page-head__rule{ margin-top:10px; }
  .opage .prose{ font-size:15px; line-height:1.6; margin:0 0 11px; text-indent:1.5em; word-wrap: break-word; overflow-wrap: break-word; max-width: 100%; }
  .opage .prose:has(.prose__cap){ text-indent:0; }
  .opage .prose__cap{ font-size:46px; padding:4px 9px 0 0; }
  .opage .margin-note{ font-size:13.5px; gap:8px; margin:6px 0 12px; }
  .opage .margin-note__rune{ font-size:15px; }
  .opage .folio{ font-size:12px; padding-top:10px; }
  .opage .title-mark{ font-size:30px; }
  .opage .title-kicker{ font-size:11px; margin-top:14px; }
  .opage .title-name{ font-size:34px; margin:8px 0 6px; }
  .opage .title-sub{ font-size:15px; }
  .opage .title-orn{ margin:18px 0; }
  .opage .title-epigraph{ font-size:16px; }
  .opage .quill{ font-size:14px; padding:10px 20px; margin-top:22px; }
  .opage .char{ gap:14px; margin-bottom:18px; }
  .opage .char__portrait{ width:74px; height:96px; }
  .opage .char__name{ font-size:19px; }
  .opage .char__role{ font-size:10px; margin:2px 0 6px; }
  .opage .char__lines{ font-size:14px; }
  .opage .placeholder__label{ font-size:10px; }
  .opage .map{ height:54vw; }
  .opage .map__name{ font-size:12px; }
  .opage .map__compass{ width:28px; height:28px; font-size:12px; }
  .opage .writing{ font-size:16px; }
  .opage .writing__caret-hint{ font-size:10px; }
  .pturn{ position:fixed; top:auto; bottom:18px; width:54px; height:54px;
    font-size:36px; color:rgba(240,214,150,0.8) !important;
    background:rgba(20,13,6,0.6); border:1px solid rgba(201,162,75,0.4); border-radius:50%; }
  .pturn--prev{ left:18px; }
  .pturn--next{ right:18px; }
  .pager{ bottom:auto; }
  .to-workspace{ left:50%; right:auto; transform:translateX(-50%); bottom:118px;
    padding:10px 18px; font-size:14px; }
  .to-workspace:hover{ transform:translateX(-50%) translateY(-2px); }
}

/* Generation progress overlay */
.gen-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(16, 11, 7, 0.95);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.gen-card {
  background: linear-gradient(135deg, rgba(58, 44, 29, 0.9), rgba(30, 22, 14, 0.9));
  border: 2px solid var(--gold);
  border-radius: 12px;
  padding: 48px 64px;
  max-width: 560px;
  text-align: center;
  box-shadow: 0 12px 48px rgba(201, 162, 75, 0.25);
}
.gen-spinner {
  font-size: 64px;
  color: var(--gold);
  margin-bottom: 24px;
  animation: spin 3s linear infinite;
}
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.gen-title {
  font-family: 'Philosopher', serif;
  font-size: 28px;
  color: var(--gold-lit);
  margin-bottom: 32px;
  font-weight: 700;
}
.gen-progress {
  margin-top: 24px;
}
.gen-bar {
  width: 100%;
  height: 8px;
  background: rgba(201, 162, 75, 0.15);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 16px;
}
.gen-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold-deep), var(--gold), var(--gold-lit));
  border-radius: 4px;
  transition: width 0.5s ease;
  animation: shimmer 2s linear infinite;
}
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
.gen-text {
  font-family: 'Philosopher', serif;
  font-size: 16px;
  color: var(--parch);
  line-height: 1.6;
}
.gen-scene-title {
  color: var(--gold-lit);
  font-style: italic;
  display: block;
  margin-top: 8px;
  font-size: 14px;
}

/* Generation progress overlay */
.gen-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 7, 5, 0.95);
  backdrop-filter: blur(12px);
  z-index: 9999;
  display: grid;
  place-items: center;
  animation: genFadeIn 0.3s ease;
}

@keyframes genFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.gen-card {
  text-align: center;
  padding: 48px 64px;
  background: rgba(26, 20, 16, 0.8);
  border: 1px solid rgba(212, 175, 112, 0.3);
  border-radius: 16px;
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
}

.gen-star {
  font-size: 72px;
  margin-bottom: 24px;
  animation: genPulse 2s ease-in-out infinite;
  filter: drop-shadow(0 0 24px rgba(212, 175, 112, 0.6));
}

@keyframes genPulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.15); opacity: 0.85; }
}

.gen-text {
  font-family: 'Philosopher', serif;
  font-size: 24px;
  font-weight: 600;
  color: #d4af70;
  margin-bottom: 12px;
  letter-spacing: 0.5px;
}

.gen-note {
  font-family: 'Philosopher', serif;
  font-size: 14px;
  color: rgba(212, 175, 112, 0.6);

}
