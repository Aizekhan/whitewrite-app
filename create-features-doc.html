<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Initialize Feature Flags</title>
</head>
<body>
  <h1>Initialize Feature Flags</h1>
  <p>This will create config/features document in Firestore.</p>
  <button id="init" style="padding: 10px 20px; font-size: 16px;">Create Document</button>
  <pre id="log" style="margin-top: 20px; padding: 10px; background: #f5f5f5;"></pre>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA-ka-oivhbGgHMSKHf4b7oE0rCgxfYu_g",
      authDomain: "whitewrite-app.firebaseapp.com",
      projectId: "whitewrite-app",
      storageBucket: "whitewrite-app.firebasestorage.app",
      messagingSenderId: "954187059234",
      appId: "1:954187059234:web:1e9d3d1a336856cb5c3a7b"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const log = document.getElementById('log');

    function addLog(msg) {
      log.textContent += msg + '\n';
      console.log(msg);
    }

    document.getElementById('init').addEventListener('click', async () => {
      try {
        addLog('Creating config/features document...');

        await db.collection('config').doc('features').set({
          universe: false,
          director: false,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        addLog('✅ SUCCESS! Document created:');
        addLog('   - universe: false (preview mode)');
        addLog('   - director: false (preview mode)');
        addLog('');
        addLog('To enable features, go to Firebase Console:');
        addLog('https://console.firebase.google.com/project/whitewrite-app/firestore/data/~2Fconfig~2Ffeatures');

      } catch (error) {
        addLog('❌ ERROR: ' + error.message);
        addLog('');
        addLog('You may need to:');
        addLog('1. Sign in first (run this from whitewrite.com after login)');
        addLog('2. Or create the document manually in Firebase Console');
      }
    });

    addLog('Ready! Click "Create Document" button above.');
  </script>
</body>
</html>
