<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сторінка не знайдена — WhiteWrite</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #1a1520 0%, #0a0608 100%);
      color: #c7c2bb;
      font-family: Georgia, serif;
      text-align: center;
      padding: 20px;
    }
    .container { max-width: 600px; }
    h1 {
      font-size: 120px;
      color: #d97706;
      margin-bottom: 20px;
      text-shadow: 0 0 30px rgba(217, 119, 6, 0.5);
    }
    h2 {
      font-size: 32px;
      color: #f3efe7;
      margin-bottom: 20px;
    }
    p {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 40px;
      color: #8a857e;
    }
    a {
      display: inline-block;
      padding: 15px 40px;
      background: linear-gradient(180deg, rgba(217,119,6,0.2), rgba(217,119,6,0.1));
      border: 1px solid rgba(217,119,6,0.4);
      border-radius: 8px;
      color: #f0a93b;
      text-decoration: none;
      font-size: 16px;
      transition: all 0.3s;
    }
    a:hover {
      background: linear-gradient(180deg, rgba(217,119,6,0.3), rgba(217,119,6,0.2));
      border-color: rgba(217,119,6,0.7);
      box-shadow: 0 0 20px rgba(217,119,6,0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Сторінка загубилась у темряві</h2>
    <p>Ця сторінка не існує або була переміщена. Поверніться до головної, щоб почати свою історію.</p>
    <a href="/">Повернутись на головну</a>
  </div>
</body>
</html>
